<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conectando Google Agenda — CRM Criativamente</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-logo"><span>CRIATIVAMENTE<span class="dot">.</span></span></div>
      <div class="auth-title" id="pageTitle">Conectando com o Google</div>
      <p class="field-error hidden" id="errorBox"></p>
      <div id="loadingBox" class="text-muted" style="font-size:13.5px;">Só um instante...</div>
      <div id="sucessoBox" class="hidden">
        <div class="empty-state"><div class="icon">✓</div><p id="sucessoTexto">Conectado!</p></div>
        <a class="btn btn-primary btn-block" href="/agenda.html">Voltar pra Agenda</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/src/lib/supabaseClient.js';
    import { requireSession } from '/src/lib/session.js';

    const session = await requireSession();
    if (!session) throw new Error('sem sessão');

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const erroGoogle = params.get('error');
    const empresaId = sessionStorage.getItem('google_oauth_empresa_id');

    const loadingBox = document.getElementById('loadingBox');
    const errorBox = document.getElementById('errorBox');

    if (erroGoogle) {
      loadingBox.classList.add('hidden');
      errorBox.textContent = 'Você cancelou a conexão ou o Google recusou o acesso. Pode tentar de novo na Agenda.';
      errorBox.classList.remove('hidden');
    } else if (!code || !empresaId) {
      loadingBox.classList.add('hidden');
      errorBox.textContent = 'Link inválido ou expirado. Volte pra Agenda e tente conectar de novo.';
      errorBox.classList.remove('hidden');
    } else {
      const redirectUri = `${window.location.origin}/auth-callback-google`;
      const { data, error } = await supabase.functions.invoke('google-oauth-callback', {
        body: { code, redirect_uri: redirectUri, empresa_id: empresaId },
      });

      loadingBox.classList.add('hidden');

      if (error || (data && data.error)) {
        errorBox.textContent = (data && data.error) || 'Não foi possível conectar agora. Tente novamente.';
        errorBox.classList.remove('hidden');
      } else {
        document.getElementById('sucessoTexto').textContent = data.email ? `Conectado como ${data.email}` : 'Conectado!';
        document.getElementById('sucessoBox').classList.remove('hidden');
        sessionStorage.removeItem('google_oauth_empresa_id');
      }
    }
  </script>
</body>
</html>
