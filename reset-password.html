<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha — CRM Criativamente</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-logo"><span>CRIATIVAMENTE<span class="dot">.</span></span></div>
      <div class="auth-title">Recuperar senha</div>
      <div class="auth-subtitle">Enviamos um link pro seu e-mail pra você criar uma senha nova.</div>

      <p class="field-error hidden" id="errorBox"></p>
      <div id="successBox" class="hidden" style="border:1px solid var(--line-strong); border-radius:var(--radius); padding:14px; margin-bottom:16px; font-size:13.5px;">
        E-mail enviado. Confira sua caixa de entrada (e o spam) e clique no link pra continuar.
      </div>

      <form id="resetForm">
        <div class="field">
          <label class="mono-label">E-mail</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Enviar link</button>
      </form>

      <p class="mt-4" style="text-align:center;">
        <a href="/login.html" class="mono-label" style="text-decoration:underline;">Voltar pro login</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/src/lib/supabaseClient.js';

    const form = document.getElementById('resetForm');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      const email = document.getElementById('email').value.trim();

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/auth-callback.html?tipo=recuperacao',
      });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar link';

      if (error) {
        errorBox.textContent = 'Não foi possível enviar o link agora. Tente novamente.';
        errorBox.classList.remove('hidden');
        return;
      }

      form.classList.add('hidden');
      successBox.classList.remove('hidden');
    });
  </script>
</body>
</html>
