<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão — CRM Criativamente</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarContainer"></div>
    <div class="main-area">
      <div id="headerContainer"></div>
      <div class="page-content">
        <div id="painelContainer"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initPage } from '/src/lib/pageInit.js';
    import { montarPainel } from '/src/lib/painelUI.js';

    const { session, perm } = await initPage({ paginaAtual: 'gestao.html', breadcrumb: 'CRM / Gestão', title: 'Gestão' });

    await montarPainel({
      containerId: 'painelContainer',
      pagina: 'gestao',
      empresaId: perm ? perm.empresa_id : null,
      usuarioId: session.user.id,
      meuPapelId: perm ? perm.papel_id : null,
    });
  </script>
</body>
</html>
