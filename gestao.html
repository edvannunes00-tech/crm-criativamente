<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão — CRM Criativamente</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarContainer"></div>
    <div class="main-area">
      <div id="headerContainer"></div>
      <div class="page-content">

        <div class="filter-bar">
          <select id="filtroPeriodo" style="background:transparent; border:1px solid var(--line-strong); border-radius:var(--radius); padding:9px 14px; color:var(--white);">
            <option value="mes">Este mês</option>
            <option value="trimestre">Este trimestre</option>
            <option value="ano">Este ano</option>
            <option value="personalizado">Personalizado...</option>
          </select>
          <input type="date" id="periodoInicio" class="hidden" style="background:transparent; border:1px solid var(--line-strong); border-radius:var(--radius); padding:9px 14px; color:var(--white);" />
          <input type="date" id="periodoFim" class="hidden" style="background:transparent; border:1px solid var(--line-strong); border-radius:var(--radius); padding:9px 14px; color:var(--white);" />
        </div>

        <div class="tabs" id="tabsNav">
          <button class="tab active" data-tab="comercial">Comercial</button>
          <button class="tab" data-tab="clientes">Clientes</button>
          <button class="tab" data-tab="projetos">Projetos</button>
          <button class="tab" data-tab="ciclo">Ciclo &amp; Funil</button>
          <button class="tab" data-tab="apontamentos">Apontamentos</button>
        </div>

        <div id="tabContent"><div class="skeleton" style="height:300px;"></div></div>

      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/src/lib/supabaseClient.js';
    import { handleQueryError } from '/src/lib/session.js';
    import { initPage } from '/src/lib/pageInit.js';
    import { formatarMoeda, escapeHtml } from '/src/lib/format.js';

    const { perm } = await initPage({ paginaAtual: 'gestao.html', breadcrumb: 'CRM / Gestão', title: 'Gestão' });
    const empresaId = perm ? perm.empresa_id : null;

    function valorOuTraco(v) { return v === null || v === undefined ? '—' : v; }
    function moedaOuTraco(v) { return v === null || v === undefined ? '—' : formatarMoeda(v); }

    function calcularPeriodo() {
      const modo = document.getElementById('filtroPeriodo').value;
      const hoje = new Date();
      if (modo === 'personalizado') {
        return { inicio: document.getElementById('periodoInicio').value, fim: document.getElementById('periodoFim').value };
      }
      let inicio;
      if (modo === 'mes') inicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
      else if (modo === 'trimestre') inicio = new Date(hoje.getFullYear(), Math.floor(hoje.getMonth() / 3) * 3, 1);
      else inicio = new Date(hoje.getFullYear(), 0, 1);
      return { inicio: inicio.toISOString().slice(0, 10), fim: hoje.toISOString().slice(0, 10) };
    }

    document.getElementById('filtroPeriodo').addEventListener('change', (e) => {
      const personalizado = e.target.value === 'personalizado';
      document.getElementById('periodoInicio').classList.toggle('hidden', !personalizado);
      document.getElementById('periodoFim').classList.toggle('hidden', !personalizado);
      if (!personalizado) abrirAbaAtual();
    });
    document.getElementById('periodoInicio').addEventListener('change', abrirAbaAtual);
    document.getElementById('periodoFim').addEventListener('change', abrirAbaAtual);

    // ---------------- COMERCIAL ----------------
    async function abaComercial() {
      const { inicio, fim } = calcularPeriodo();
      if (!inicio || !fim) return `<div class="empty-state"><p>Escolha as duas datas do período personalizado.</p></div>`;

      const [{ data: ind, error: e1 }, { data: funil, error: e2 }] = await Promise.all([
        supabase.rpc('indicadores_comerciais', { p_empresa_id: empresaId, p_data_inicio: inicio, p_data_fim: fim }),
        supabase.rpc('funil_conversao', { p_empresa_id: empresaId, p_data_inicio: inicio, p_data_fim: fim }),
      ]);
      if (e1 || e2) { if (await handleQueryError(e1 || e2)) return ''; return `<div class="error-state"><p>Não foi possível carregar os indicadores comerciais.</p></div>`; }

      const i = (ind && ind[0]) || {};
      return `
        <div class="indicator-grid">
          <div class="indicator-card"><div class="label mono-label">Oportunidades criadas</div><div class="value">${valorOuTraco(i.total_criadas)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Ganhas</div><div class="value">${valorOuTraco(i.total_ganhas)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Perdidas</div><div class="value">${valorOuTraco(i.total_perdidas)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Taxa de conversão</div><div class="value">${i.taxa_conversao_percentual != null ? i.taxa_conversao_percentual + '%' : '—'}</div></div>
        </div>
        <div class="indicator-grid">
          <div class="indicator-card"><div class="label mono-label">Valor ganho no período</div><div class="value" style="font-size:18px;">${moedaOuTraco(i.valor_total_ganho)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Ticket médio</div><div class="value" style="font-size:18px;">${moedaOuTraco(i.ticket_medio)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Ciclo médio de venda</div><div class="value" style="font-size:18px;">${i.ciclo_venda_medio_dias != null ? i.ciclo_venda_medio_dias + ' dias' : '—'}</div></div>
        </div>
        <div class="mono-label mb-4" style="margin-top:8px;">Funil (etapa atual dos deals criados no período)</div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Etapa</th><th>Quantidade</th><th>Valor</th></tr></thead>
          <tbody>${(funil || []).map((f) => `<tr><td class="cell-primary">${escapeHtml(f.etapa)}</td><td>${f.quantidade}</td><td>${formatarMoeda(f.valor_total)}</td></tr>`).join('')}</tbody>
        </table></div>
      `;
    }

    // ---------------- CLIENTES ----------------
    async function abaClientes() {
      const { inicio, fim } = calcularPeriodo();
      if (!inicio || !fim) return `<div class="empty-state"><p>Escolha as duas datas do período personalizado.</p></div>`;

      const { data, error } = await supabase.rpc('indicadores_clientes', { p_empresa_id: empresaId, p_data_inicio: inicio, p_data_fim: fim });
      if (error) { if (await handleQueryError(error)) return ''; return `<div class="error-state"><p>Não foi possível carregar os indicadores de clientes.</p></div>`; }
      const c = (data && data[0]) || {};

      return `
        <div class="indicator-grid">
          <div class="indicator-card"><div class="label mono-label">Novos no período</div><div class="value">${valorOuTraco(c.novos_clientes)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Total de clientes</div><div class="value">${valorOuTraco(c.total_clientes)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Ativos</div><div class="value">${valorOuTraco(c.clientes_ativos)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Recorrentes</div><div class="value">${valorOuTraco(c.clientes_recorrentes)}</div></div>
        </div>
        <div class="indicator-grid">
          <div class="indicator-card"><div class="label mono-label">Inativos</div><div class="value">${valorOuTraco(c.clientes_inativos)}</div></div>
          <div class="indicator-card"><div class="label mono-label">LTV médio</div><div class="value" style="font-size:18px;">${moedaOuTraco(c.ltv_medio)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Taxa de recompra</div><div class="value" style="font-size:18px;">${c.taxa_recompra_percentual != null ? c.taxa_recompra_percentual + '%' : '—'}</div></div>
        </div>
      `;
    }

    // ---------------- PROJETOS ----------------
    async function abaProjetos() {
      const [{ data: ind, error: e1 }, { data: gargalos, error: e2 }] = await Promise.all([
        supabase.rpc('indicadores_projetos', { p_empresa_id: empresaId }),
        supabase.from('vw_projeto_gargalos').select('*'),
      ]);
      if (e1 || e2) { if (await handleQueryError(e1 || e2)) return ''; return `<div class="error-state"><p>Não foi possível carregar os indicadores de projetos.</p></div>`; }
      const p = (ind && ind[0]) || {};

      return `
        <div class="indicator-grid">
          <div class="indicator-card"><div class="label mono-label">Ativos</div><div class="value">${valorOuTraco(p.projetos_ativos)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Concluídos</div><div class="value">${valorOuTraco(p.projetos_concluidos)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Atrasados</div><div class="value">${valorOuTraco(p.projetos_atrasados)}</div></div>
          <div class="indicator-card"><div class="label mono-label">Tempo médio por etapa</div><div class="value" style="font-size:18px;">${p.tempo_medio_etapa_dias != null ? p.tempo_medio_etapa_dias + ' dias' : '—'}</div></div>
        </div>
        <div class="mono-label mb-4" style="margin-top:8px;">Possíveis gargalos</div>
        ${(!gargalos || gargalos.length === 0) ? `<div class="empty-state"><p>Nenhum gargalo identificado no momento.</p></div>` : `
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>Área</th><th>Etapa</th><th>Status</th></tr></thead>
            <tbody>${gargalos.map((g) => `<tr><td class="cell-primary">${escapeHtml(g.area_nome)}</td><td>${escapeHtml(g.etapa_nome)}</td><td><span class="badge dot-erro"><span class="dot"></span>${g.etapa_atrasada ? 'Etapa atrasada' : 'Travado'}</span></td></tr>`).join('')}</tbody>
          </table></div>
        `}
      `;
    }

    // ---------------- CICLO & FUNIL ----------------
    async function abaCiclo() {
      const { inicio, fim } = calcularPeriodo();
      if (!inicio || !fim) return `<div class="empty-state"><p>Escolha as duas datas do período personalizado.</p></div>`;

      const [{ data: tempos, error: e1 }, { data: conversao, error: e2 }, { data: ciclo, error: e3 }] = await Promise.all([
        supabase.rpc('tempo_medio_por_etapa', { p_empresa_id: empresaId, p_data_inicio: inicio, p_data_fim: fim }),
        supabase.rpc('conversao_entre_etapas', { p_empresa_id: empresaId, p_data_inicio: inicio, p_data_fim: fim }),
        supabase.rpc('ciclo_venda', { p_empresa_id: empresaId, p_data_inicio: inicio, p_data_fim: fim }),
      ]);
      if (e1 || e2 || e3) { if (await handleQueryError(e1 || e2 || e3)) return ''; return `<div class="error-state"><p>Não foi possível carregar o ciclo/funil.</p></div>`; }

      return `
        <div class="mono-label mb-4">Ciclo de venda (Ganho x Perdido, nunca misturados)</div>
        <div class="indicator-grid">
          ${(ciclo || []).map((c) => `<div class="indicator-card"><div class="label mono-label">${c.resultado}</div><div class="value" style="font-size:18px;">${c.tempo_medio_dias} dias</div><div class="text-muted" style="font-size:11px;">${c.quantidade} amostra(s) · mediana ${c.tempo_mediano_dias}d</div></div>`).join('') || '<div class="text-muted">Sem dados suficientes no período.</div>'}
        </div>

        <div class="mono-label mb-4" style="margin-top:16px;">Tempo médio por etapa (histórico real de transições)</div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Etapa</th><th>Amostras</th><th>Médio</th><th>Mediana</th><th>Mín</th><th>Máx</th></tr></thead>
          <tbody>${(tempos || []).map((t) => `<tr><td class="cell-primary">${escapeHtml(t.etapa)}</td><td>${t.amostras}</td><td>${t.tempo_medio_dias ?? '—'}d</td><td>${t.tempo_mediano_dias ?? '—'}d</td><td>${t.tempo_minimo_dias ?? '—'}d</td><td>${t.tempo_maximo_dias ?? '—'}d</td></tr>`).join('')}</tbody>
        </table></div>

        <div class="mono-label mb-4" style="margin-top:16px;">Conversão real entre etapas adjacentes</div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>De</th><th>Para</th><th>Entraram</th><th>Avançaram</th><th>Taxa</th></tr></thead>
          <tbody>${(conversao || []).map((c) => `<tr><td class="cell-primary">${escapeHtml(c.etapa_origem)}</td><td>${escapeHtml(c.etapa_destino)}</td><td>${c.entraram}</td><td>${c.avancaram}</td><td>${c.taxa_conversao_percentual}%</td></tr>`).join('')}</tbody>
        </table></div>
      `;
    }

    // ---------------- APONTAMENTOS ----------------
    async function abaApontamentos() {
      const { data, error } = await supabase.rpc('apontamentos_gerenciais', { p_empresa_id: empresaId });
      if (error) { if (await handleQueryError(error)) return ''; return `<div class="error-state"><p>Não foi possível carregar os apontamentos.</p></div>`; }
      if (!data || data.length === 0) return `<div class="empty-state"><div class="icon">✓</div><p>Nenhum apontamento no momento.</p></div>`;

      return data.map((a) => `
        <div class="apontamento ${a.prioridade}">
          <div>
            <div class="titulo">${escapeHtml(a.titulo)}</div>
            ${a.detalhe ? `<div class="detalhe">${escapeHtml(a.detalhe)}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    const abas = { comercial: abaComercial, clientes: abaClientes, projetos: abaProjetos, ciclo: abaCiclo, apontamentos: abaApontamentos };

    async function abrirAba(nome) {
      document.querySelectorAll('#tabsNav .tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === nome));
      const content = document.getElementById('tabContent');
      content.innerHTML = '<div class="skeleton" style="height:300px;"></div>';
      content.innerHTML = await abas[nome]();
    }

    function abaAtualNome() { return document.querySelector('#tabsNav .tab.active').dataset.tab; }
    function abrirAbaAtual() { abrirAba(abaAtualNome()); }

    document.querySelectorAll('#tabsNav .tab').forEach((btn) => btn.addEventListener('click', () => abrirAba(btn.dataset.tab)));

    await abrirAba('comercial');
  </script>
</body>
</html>
