<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha do Cliente — CRM Criativamente</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarContainer"></div>
    <div class="main-area">
      <div id="headerContainer"></div>
      <div class="page-content">

        <div id="cabecalho">
          <div class="skeleton" style="height:80px;"></div>
        </div>

        <div class="indicator-grid" id="resumoCards"></div>

        <div class="tabs" id="tabsNav">
          <button class="tab active" data-tab="resumo">Resumo</button>
          <button class="tab" data-tab="timeline">Timeline</button>
          <button class="tab" data-tab="oportunidades">Oportunidades</button>
          <button class="tab" data-tab="projetos">Projetos</button>
          <button class="tab" data-tab="documentos">Documentos</button>
        </div>

        <div id="tabContent"><div class="skeleton skeleton-row"></div></div>

      </div>
    </div>
  </div>

  <!-- Modal Editar Cliente -->
  <div id="modalEditarOverlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100;">
    <div class="card" style="width:100%; max-width:480px; max-height:85vh; overflow-y:auto;">
      <div class="flex items-center justify-between mb-4">
        <span class="mono-label">Editar Cliente</span>
        <button class="btn-ghost" id="btnFecharModalEditar">Fechar</button>
      </div>
      <p class="field-error hidden" id="modalEditarErro"></p>
      <form id="formEditarCliente">
        <div class="field"><label class="mono-label">Nome *</label><input type="text" id="eNome" required /></div>
        <div class="field"><label class="mono-label">WhatsApp *</label><input type="text" id="eWhatsapp" required /></div>
        <div class="field"><label class="mono-label">E-mail</label><input type="email" id="eEmail" /></div>
        <div class="field"><label class="mono-label">Instagram</label><input type="text" id="eInstagram" /></div>
        <div class="field"><label class="mono-label">Cidade</label><input type="text" id="eCidade" /></div>
        <div class="field"><label class="mono-label">Profissão / Atividade</label><input type="text" id="eProfissao" /></div>
        <div class="field"><label class="mono-label">Observações</label><textarea id="eObservacoes" rows="3"></textarea></div>
        <button type="submit" class="btn btn-primary btn-block" id="btnSalvarEdicao">Salvar alterações</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/src/lib/supabaseClient.js';
    import { handleQueryError } from '/src/lib/session.js';
    import { initPage } from '/src/lib/pageInit.js';
    import { formatarMoeda, formatarData, tempoRelativo, escapeHtml, whatsappLink, statusBadgeClasse, aplicarMascaraTelefone } from '/src/lib/format.js';
    import { podeFazer } from '/src/lib/session.js';

    const { perm } = await initPage({ paginaAtual: 'clientes.html', breadcrumb: 'CRM / Clientes / Ficha', title: 'Ficha do Cliente' });
    const podeEditar = podeFazer(perm, 'leads', 'editar') || podeFazer(perm, 'clientes', 'editar');

    const params = new URLSearchParams(window.location.search);
    const contatoId = params.get('id');

    if (!contatoId) {
      document.getElementById('cabecalho').innerHTML = `<div class="error-state"><p>Nenhum cliente indicado na URL.</p></div>`;
      throw new Error('sem id');
    }

    let contato = null;

    async function carregarCabecalho() {
      const { data, error } = await supabase.from('vw_contatos_status').select('*').eq('id', contatoId).maybeSingle();

      if (error) {
        if (await handleQueryError(error)) return;
        document.getElementById('cabecalho').innerHTML = `<div class="error-state"><p>Não foi possível carregar este cliente.</p></div>`;
        return;
      }

      if (!data) {
        document.getElementById('cabecalho').innerHTML = `<div class="error-state"><p>Cliente não encontrado — ou você não tem acesso a ele.</p></div>`;
        return;
      }

      contato = data;
      document.getElementById('headerContainer').querySelector('.header-title').textContent = data.nome;

      const wpp = whatsappLink(data.whatsapp);

      document.getElementById('cabecalho').innerHTML = `
        <div class="card" style="margin-bottom:24px;">
          <div class="flex items-center justify-between">
            <div>
              <div style="font-size:22px; font-weight:800;">${escapeHtml(data.nome)}</div>
              <div class="text-muted mt-1" style="font-size:13px;">
                ${escapeHtml(data.empresa_marca || '')} ${data.empresa_marca ? '·' : ''}
                ${escapeHtml(data.profissao_atividade || 'Segmento não informado')}
              </div>
            </div>
            <div class="flex gap-2 items-center">
              <span class="badge ${statusBadgeClasse(data.status_calculado)}"><span class="dot"></span>${data.status_calculado}</span>
              ${podeEditar ? `<button class="btn btn-secondary btn-sm" id="btnEditar">Editar</button>` : ''}
              ${wpp ? `<a class="btn btn-secondary btn-sm" href="${wpp}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
            </div>
          </div>
        </div>
      `;

      if (podeEditar) document.getElementById('btnEditar').addEventListener('click', abrirModalEdicao);

      document.getElementById('resumoCards').innerHTML = `
        <div class="indicator-card"><div class="label mono-label">LTV</div><div class="value">${formatarMoeda(data.ltv_total)}</div></div>
        <div class="indicator-card"><div class="label mono-label">Última compra</div><div class="value" style="font-size:16px;">${data.ultima_compra_at ? tempoRelativo(data.ultima_compra_at) : '—'}</div></div>
        <div class="indicator-card"><div class="label mono-label">Cliente desde</div><div class="value" style="font-size:16px;">${formatarData(data.created_at)}</div></div>
        <div class="indicator-card"><div class="label mono-label">Responsável</div><div class="value" style="font-size:16px;">${data.responsavel_id ? '—' : 'Não atribuído'}</div></div>
      `;
    }

    // ---------------- ABAS ----------------
    const abas = {
      resumo: async () => {
        return `
          <div class="card">
            <div class="mono-label mb-4">Dados de cadastro</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; font-size:13.5px;">
              <div><span class="text-muted">WhatsApp:</span> ${escapeHtml(contato.whatsapp || '—')}</div>
              <div><span class="text-muted">E-mail:</span> ${escapeHtml(contato.email || '—')}</div>
              <div><span class="text-muted">Cidade:</span> ${escapeHtml(contato.cidade || '—')} ${escapeHtml(contato.estado || '')}</div>
              <div><span class="text-muted">Instagram:</span> ${escapeHtml(contato.instagram || '—')}</div>
              <div><span class="text-muted">Origem da página:</span> ${escapeHtml(contato.origem_pagina || '—')}</div>
              <div><span class="text-muted">Prazo desejado:</span> ${escapeHtml(contato.proximo_followup_at ? formatarData(contato.proximo_followup_at) : '—')}</div>
            </div>
            ${contato.observacoes ? `<div class="mt-4"><span class="text-muted mono-label">Observações</span><p style="font-size:13.5px; margin-top:4px;">${escapeHtml(contato.observacoes)}</p></div>` : ''}
          </div>
        `;
      },

      timeline: async () => {
        const { data, error } = await supabase.from('atividades').select('*').eq('contato_id', contatoId).order('created_at', { ascending: false }).limit(50);
        if (error) return `<div class="error-state"><p>Não foi possível carregar a timeline.</p></div>`;
        if (!data || data.length === 0) return `<div class="empty-state"><p>Nenhuma atividade registrada ainda.</p></div>`;
        return `
          <div class="card">
            <div class="timeline">
              ${data.map((a) => `
                <div class="timeline-item">
                  <div class="ts">${formatarData(a.created_at, true)}</div>
                  <div class="title">${escapeHtml(a.titulo)}</div>
                  ${a.descricao ? `<div class="desc">${escapeHtml(a.descricao)}</div>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      },

      oportunidades: async () => {
        const { data, error } = await supabase.from('oportunidades').select('id, titulo, valor_final, created_at, etapa_id, pipeline_etapas(nome, is_ganho, is_perdido)').eq('contato_id', contatoId).order('created_at', { ascending: false });
        if (error) return `<div class="error-state"><p>Não foi possível carregar as oportunidades.</p></div>`;
        if (!data || data.length === 0) return `<div class="empty-state"><p>Nenhuma oportunidade ainda para este contato.</p></div>`;
        return `
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Título</th><th>Etapa</th><th>Valor</th><th>Criada em</th></tr></thead>
              <tbody>
                ${data.map((o) => {
                  const etapa = o.pipeline_etapas || {};
                  const classe = etapa.is_ganho ? 'dot-sucesso' : etapa.is_perdido ? 'dot-erro' : 'dot-info';
                  return `
                    <tr>
                      <td class="cell-primary">${escapeHtml(o.titulo)}</td>
                      <td><span class="badge ${classe}"><span class="dot"></span>${escapeHtml(etapa.nome || '—')}</span></td>
                      <td>${formatarMoeda(o.valor_final)}</td>
                      <td class="cell-muted">${formatarData(o.created_at)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      },

      projetos: async () => {
        const { data, error } = await supabase.from('projetos').select('id, nome, status, prazo').eq('contato_id', contatoId).order('created_at', { ascending: false });
        if (error) return `<div class="error-state"><p>Não foi possível carregar os projetos.</p></div>`;
        if (!data || data.length === 0) return `<div class="empty-state"><p>Nenhum projeto vinculado a este contato ainda.</p></div>`;
        return `
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Projeto</th><th>Status</th><th>Prazo</th></tr></thead>
              <tbody>
                ${data.map((p) => `
                  <tr>
                    <td class="cell-primary">${escapeHtml(p.nome)}</td>
                    <td><span class="badge dot-info"><span class="dot"></span>${escapeHtml(p.status)}</span></td>
                    <td class="cell-muted">${p.prazo ? formatarData(p.prazo) : '—'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      },

      documentos: async () => {
        const { data, error } = await supabase.from('documentos').select('id, nome_arquivo, tipo_documento, created_at').eq('entidade_tipo', 'contato').eq('entidade_id', contatoId).order('created_at', { ascending: false });
        if (error) return `<div class="error-state"><p>Não foi possível carregar os documentos.</p></div>`;
        if (!data || data.length === 0) return `<div class="empty-state"><p>Nenhum documento anexado ainda.</p></div>`;
        return `
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Arquivo</th><th>Tipo</th><th>Enviado em</th></tr></thead>
              <tbody>
                ${data.map((d) => `
                  <tr><td class="cell-primary">${escapeHtml(d.nome_arquivo || '—')}</td><td>${escapeHtml(d.tipo_documento || '—')}</td><td class="cell-muted">${formatarData(d.created_at)}</td></tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      },
    };

    async function abrirAba(nome) {
      document.querySelectorAll('#tabsNav .tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === nome));
      const content = document.getElementById('tabContent');
      content.innerHTML = '<div class="skeleton skeleton-row"></div>';
      content.innerHTML = await abas[nome]();
    }

    document.querySelectorAll('#tabsNav .tab').forEach((btn) => {
      btn.addEventListener('click', () => abrirAba(btn.dataset.tab));
    });

    // ---------------- EDITAR CLIENTE ----------------
    const overlayEditar = document.getElementById('modalEditarOverlay');
    let mascaraAplicada = false;

    function abrirModalEdicao() {
      document.getElementById('eNome').value = contato.nome || '';
      document.getElementById('eWhatsapp').value = contato.whatsapp || '';
      document.getElementById('eEmail').value = contato.email || '';
      document.getElementById('eInstagram').value = contato.instagram || '';
      document.getElementById('eCidade').value = contato.cidade || '';
      document.getElementById('eProfissao').value = contato.profissao_atividade || '';
      document.getElementById('eObservacoes').value = contato.observacoes || '';
      document.getElementById('modalEditarErro').classList.add('hidden');
      overlayEditar.classList.remove('hidden');
      if (!mascaraAplicada) {
        aplicarMascaraTelefone(document.getElementById('eWhatsapp'));
        mascaraAplicada = true;
      }
    }

    document.getElementById('btnFecharModalEditar').addEventListener('click', () => overlayEditar.classList.add('hidden'));
    overlayEditar.addEventListener('click', (e) => { if (e.target === overlayEditar) overlayEditar.classList.add('hidden'); });

    document.getElementById('formEditarCliente').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroBox = document.getElementById('modalEditarErro');
      erroBox.classList.add('hidden');
      const btn = document.getElementById('btnSalvarEdicao');
      btn.disabled = true; btn.textContent = 'Salvando...';

      const payload = {
        nome: document.getElementById('eNome').value.trim(),
        whatsapp: document.getElementById('eWhatsapp').value.trim(),
        email: document.getElementById('eEmail').value.trim() || null,
        instagram: document.getElementById('eInstagram').value.trim() || null,
        cidade: document.getElementById('eCidade').value.trim() || null,
        profissao_atividade: document.getElementById('eProfissao').value.trim() || null,
        observacoes: document.getElementById('eObservacoes').value.trim() || null,
      };

      const { error } = await supabase.from('contatos').update(payload).eq('id', contatoId);

      btn.disabled = false; btn.textContent = 'Salvar alterações';

      if (error) {
        erroBox.textContent = 'Não foi possível salvar as alterações agora.';
        erroBox.classList.remove('hidden');
        return;
      }

      overlayEditar.classList.add('hidden');
      await carregarCabecalho();
    });

    await carregarCabecalho();
    if (contato) await abrirAba('resumo');
  </script>
</body>
</html>
