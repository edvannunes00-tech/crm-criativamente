<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seu contrato — Criativamente</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <style>
    body { background: var(--black); }
    .publico-shell { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }
    .publico-logo { font-family: var(--font-mono); font-weight: 800; font-size: 18px; margin-bottom: 24px; text-align: center; }
    .publico-logo .dot { color: var(--accent); }
    .passo-label { font-family: var(--font-mono); font-size: 11px; color: var(--gray-2); text-transform: uppercase; margin-bottom: 8px; }
    .resumo-linha { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--line); }
    .resumo-linha:last-child { border-bottom: none; }
    .item-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
    .step-hidden { display: none; }
    .escopo-linha { font-size: 13.5px; line-height: 1.6; margin-top: 6px; }
    .escopo-linha strong { font-weight: 700; }
    .contrato-texto { max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; font-size: 12.5px; line-height: 1.6; }
    .contrato-texto h4 { font-size: 12px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: 0.03em; }
    .contrato-texto h4:first-child { margin-top: 0; }
    .contrato-texto p { margin: 0 0 4px; white-space: pre-line; }
  </style>
</head>
<body>
  <div class="publico-shell">
    <div class="publico-logo">CRIATIVAMENTE<span class="dot">.</span></div>
    <div id="conteudo"><div class="skeleton" style="height:200px;"></div></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module">
    import { SUPABASE_URL } from '/src/lib/supabaseClient.js';
    import { formatarMoeda } from '/src/lib/format.js';
    import { clausulasDoContrato, montarContextoJuridico } from '/src/lib/contratoTexto.js';
    import { gerarPdfContrato, carregarLogoDataUrl } from '/src/lib/contratoPdf.js';
    import { FONTES_ASSINATURA, garantirFontesAssinatura, desenharTextoNoCanvas } from '/src/lib/assinaturaTexto.js';

    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/contrato-publico`;
    const hash = window.location.hash.replace('#', '');
    const params = new URLSearchParams(hash);
    let token = params.get('t');
    try {
      if (token) sessionStorage.setItem('contratoToken', token);
      else token = sessionStorage.getItem('contratoToken');
    } catch { /* sem sessionStorage: segue so com o hash */ }
    const conteudo = document.getElementById('conteudo');
    const CHECKOUT_URL = `${SUPABASE_URL}/functions/v1/recorrencia-checkout`;
    const totalPassos = () => (dadosContrato && dadosContrato.recorrencia ? 7 : 6);

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    const ROTULO_INCLUSAO = { incluido: 'Incluído', nao_incluido: 'Não incluído', adicional: 'Contratação adicional (fora deste escopo)' };
    const ROTULO_MODALIDADE = { remoto: 'Remota (gravação pelo CONTRATANTE, com orientação)', presencial: 'Presencial, em São Paulo e região (agendamento prévio)', hibrido: 'Híbrida' };

    function renderIndisponivel() {
      conteudo.innerHTML = `
        <div class="card">
          <p style="font-size:15px; line-height:1.6;">Este link não está mais disponível.</p>
          <p class="text-muted mt-2" style="font-size:13.5px; line-height:1.6;">O acesso pode ter expirado ou o contrato já ter sido finalizado.</p>
          <p class="text-muted mt-4" style="font-size:13.5px;">Se precisar de uma cópia do contrato, você pode solicitar uma segunda via.</p>
          <a href="/contrato-segunda-via.html" class="btn btn-primary btn-block mt-4">Solicitar segunda via</a>
        </div>
      `;
    }

    if (!token) {
      renderIndisponivel();
    } else {
      carregar();
    }

    let dadosContrato = null;
    let dadosContratada = null;
    let dadosPreenchidos = null;

    async function carregar() {
      try {
        const resp = await fetch(`${FUNCTION_URL}?t=${encodeURIComponent(token)}`);
        const body = await resp.json();
        if (!body.disponivel) { renderIndisponivel(); return; }
        dadosContrato = body.contrato;
        dadosContratada = body.contratada || null;
        if (body.pos_confirmacao) { if (dadosContrato.recorrencia) renderPagamento(); else renderAssinatura(); return; }
        renderRevisao();
      } catch {
        conteudo.innerHTML = `<div class="error-state"><p>Não foi possível carregar o contrato agora. Tente novamente em instantes.</p></div>`;
      }
    }

    function dadosSalvosDoCliente() {
      if (dadosPreenchidos) return dadosPreenchidos;
      try { return JSON.parse(sessionStorage.getItem('contratoDados') || 'null'); } catch { return null; }
    }

    // Gera o PDF do contrato no navegador. leitura=true: marca d'água "NÃO ASSINADO"; senão, cópia assinada.
    async function gerarPdfPublico({ leitura, assinaturaCliente }) {
      const dados = dadosSalvosDoCliente();
      if (!dados || !dadosContrato || !window.jspdf) return null;
      return gerarPdfContrato({
        contrato: dadosContrato, itens: dadosContrato.itens || [], bonus: dadosContrato.bonus || [],
        empresaNome: dadosContratada?.nome, contratadaDocumento: dadosContratada?.documento, contratadaEndereco: dadosContratada?.endereco,
        contratadaResponsavel: dadosContratada?.responsavel, contratadaResponsavelCpf: dadosContratada?.responsavelCpf, contratadaResponsavelCargo: dadosContratada?.responsavelCargo,
        contratadaAssinaturaDataUrl: dadosContratada?.assinatura?.dataUrl || null, contratadaAssinadaEm: dadosContratada?.assinatura?.assinadoEm || null,
        marcaDagua: leitura ? { linha1: 'NÃO ASSINADO', linha2: 'Versão apenas para leitura' } : null,
        logoDataUrl: await carregarLogoDataUrl(), clienteSnapshot: dados, versao: leitura ? 'para leitura' : 'assinada',
        assinatura: assinaturaCliente ? { dataUrl: assinaturaCliente, confirmadoEm: new Date().toISOString() } : null,
      });
    }
    async function abrirPdf(blob, nomeArquivo, baixar) {
      const url = URL.createObjectURL(blob);
      if (baixar) {
        const a = document.createElement('a'); a.href = url; a.download = nomeArquivo; document.body.appendChild(a); a.click(); a.remove();
      } else {
        window.open(url, '_blank');
      }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    function renderRevisao() {
      const c = dadosContrato;
      conteudo.innerHTML = `
        <div class="passo-label">Passo 1 de ${totalPassos()} — O que você está contratando</div>
        <div class="card mb-4">
          <div style="font-size:17px; font-weight:800; margin-bottom:12px;">${escapeHtml(c.titulo)}</div>
          ${(c.itens || []).map((i) => `
            <div class="item-card">
              <div class="flex items-center justify-between"><span>${escapeHtml(i.descricao)} ${i.quantidade > 1 ? `(x${i.quantidade})` : ''}</span><span style="font-weight:700;">${formatarMoeda(i.valor_total)}</span></div>
            </div>
          `).join('')}
          <div class="mt-4">
            <div class="resumo-linha"><span>Preço de tabela</span><span>${formatarMoeda(c.valor_tabela_total)}</span></div>
            <div class="resumo-linha"><span>Desconto</span><span>${formatarMoeda(c.desconto_total)}</span></div>
            <div class="resumo-linha"><span style="font-weight:800;">Valor negociado</span><span style="font-weight:800;">${formatarMoeda(c.valor_negociado_total)}</span></div>
          </div>
          ${c.condicoes_pagamento_texto ? `<div class="mt-4"><span class="mono-label">Condições de pagamento</span><p style="font-size:13.5px; margin-top:4px;">${escapeHtml(c.condicoes_pagamento_texto)}</p></div>` : ''}
          ${(c.bonus || []).length > 0 ? `<div class="mt-4"><span class="mono-label">Bônus</span><ul style="margin-top:4px; padding-left:18px; font-size:13.5px;">${c.bonus.map((b) => `<li>${escapeHtml(b.descricao)}${b.quantidade ? ` (x${b.quantidade})` : ''}</li>`).join('')}</ul></div>` : ''}
          ${c.condicoes_especiais ? `<div class="mt-4"><span class="mono-label">Condições especiais</span><p style="font-size:13.5px; margin-top:4px;">${escapeHtml(c.condicoes_especiais)}</p></div>` : ''}
        </div>
        <button class="btn btn-primary btn-block" id="btnProsseguirDados">Prosseguir para meus dados</button>
      `;
      document.getElementById('btnProsseguirDados').addEventListener('click', renderFormularioDados);
    }

    function renderFormularioDados() {
      conteudo.innerHTML = `
        <div class="passo-label">Passo 2 de ${totalPassos()} — Seus dados</div>
        <div class="card">
          <form id="formDados">
            <div class="field"><label class="mono-label">Nome completo *</label><input type="text" id="dNome" required /></div>
            <div class="field"><label class="mono-label">CPF/CNPJ *</label><input type="text" id="dCpfCnpj" required /></div>
            <div class="field"><label class="mono-label">Empresa / Razão social (se estiver assinando por uma empresa)</label><input type="text" id="dEmpresaMarca" /></div>
            <div class="field"><label class="mono-label">Telefone *</label><input type="text" id="dTelefone" required /></div>
            <div class="field"><label class="mono-label">E-mail *</label><input type="email" id="dEmail" required /></div>
            <p class="mono-label mt-4" style="opacity:0.7;">Endereço (obrigatório)</p>
            <div class="field"><label class="mono-label">CEP *</label><input type="text" id="dCep" required /></div>
            <div class="field"><label class="mono-label">Logradouro *</label><input type="text" id="dLogradouro" required /></div>
            <div class="flex gap-2">
              <div class="field" style="flex:1;"><label class="mono-label">Número *</label><input type="text" id="dNumero" required /></div>
              <div class="field" style="flex:2;"><label class="mono-label">Complemento</label><input type="text" id="dComplemento" /></div>
            </div>
            <div class="field"><label class="mono-label">Bairro *</label><input type="text" id="dBairro" required /></div>
            <div class="flex gap-2">
              <div class="field" style="flex:2;"><label class="mono-label">Cidade *</label><input type="text" id="dCidade" required /></div>
              <div class="field" style="flex:1;"><label class="mono-label">Estado *</label><input type="text" id="dEstado" maxlength="2" required /></div>
            </div>
            <p class="text-muted" style="font-size:11.5px; line-height:1.5;">Seus dados ficam vinculados exclusivamente a este contrato — não atualizam automaticamente nenhum outro cadastro.</p>
            <button type="submit" class="btn btn-primary btn-block" id="btnSalvarDados">Continuar</button>
          </form>
        </div>
      `;
      let previo = dadosPreenchidos;
      if (!previo) { try { previo = JSON.parse(sessionStorage.getItem('contratoDados') || 'null'); } catch { previo = null; } }
      if (previo) {
        const mapa = { dNome: 'nome_completo', dCpfCnpj: 'cpf_cnpj', dEmpresaMarca: 'empresa_marca', dTelefone: 'telefone', dEmail: 'email', dCep: 'endereco_cep', dLogradouro: 'endereco_logradouro', dNumero: 'endereco_numero', dComplemento: 'endereco_complemento', dBairro: 'endereco_bairro', dCidade: 'endereco_cidade', dEstado: 'endereco_estado' };
        Object.entries(mapa).forEach(([id, k]) => { const el = document.getElementById(id); if (el && previo[k]) el.value = previo[k]; });
      }
      document.getElementById('formDados').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSalvarDados');
        btn.disabled = true; btn.textContent = 'Salvando...';
        const dados = {
          nome_completo: document.getElementById('dNome').value.trim(),
          cpf_cnpj: document.getElementById('dCpfCnpj').value.trim(),
          empresa_marca: document.getElementById('dEmpresaMarca').value.trim() || null,
          telefone: document.getElementById('dTelefone').value.trim(),
          email: document.getElementById('dEmail').value.trim(),
          endereco_cep: document.getElementById('dCep').value.trim() || null,
          endereco_logradouro: document.getElementById('dLogradouro').value.trim() || null,
          endereco_numero: document.getElementById('dNumero').value.trim() || null,
          endereco_complemento: document.getElementById('dComplemento').value.trim() || null,
          endereco_bairro: document.getElementById('dBairro').value.trim() || null,
          endereco_cidade: document.getElementById('dCidade').value.trim() || null,
          endereco_estado: document.getElementById('dEstado').value.trim() || null,
        };
        try {
          const resp = await fetch(FUNCTION_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, acao: 'salvar', dados }),
          });
          const body = await resp.json();
          if (!body.ok) { renderIndisponivel(); return; }
          dadosPreenchidos = dados;
          try { sessionStorage.setItem('contratoDados', JSON.stringify(dados)); } catch { /* opcional */ }
          renderEscopo();
        } catch {
          alert('Não foi possível salvar seus dados agora. Tente novamente.');
          btn.disabled = false; btn.textContent = 'Continuar';
        }
      });
    }

    function renderEscopo() {
      const itens = dadosContrato.itens || [];
      conteudo.innerHTML = `
        <div class="passo-label">Passo 3 de ${totalPassos()} — Escopo contratado</div>
        <div class="card">
          ${itens.map((i) => `
            <div class="mb-4">
              <div style="font-size:15px; font-weight:700; margin-bottom:4px;">${escapeHtml(i.descricao || 'Item contratado')}</div>
              ${i.escopo_objeto ? `<p class="escopo-linha">${escapeHtml(i.escopo_objeto)}</p>` : ''}
              ${i.escopo_quantidade_maxima_aulas ? `<p class="escopo-linha"><strong>Quantidade contratada:</strong> até ${i.escopo_quantidade_maxima_aulas} aulas (limite total contratado — aulas/regravações adicionais além disso podem gerar novo orçamento)</p>` : ''}
              ${i.escopo_modalidade_gravacao ? `<p class="escopo-linha"><strong>Modalidade de gravação:</strong> ${escapeHtml(ROTULO_MODALIDADE[i.escopo_modalidade_gravacao] || i.escopo_modalidade_gravacao)}</p>` : ''}
              ${i.escopo_equipamentos ? `<p class="escopo-linha"><strong>Equipamentos:</strong> ${escapeHtml(i.escopo_equipamentos)}</p>` : ''}
              ${i.escopo_edicao ? `<p class="escopo-linha"><strong>Edição:</strong> ${escapeHtml(i.escopo_edicao)}</p>` : ''}
              ${i.escopo_capas ? `<p class="escopo-linha"><strong>Capas/miniaturas:</strong> ${escapeHtml(i.escopo_capas)}</p>` : ''}
              ${i.escopo_plataforma ? `<p class="escopo-linha"><strong>Plataforma:</strong> ${escapeHtml(i.escopo_plataforma)}</p>` : ''}
              ${i.escopo_pagina_vendas ? `<p class="escopo-linha"><strong>Página de vendas:</strong> ${escapeHtml(i.escopo_pagina_vendas)}</p>` : ''}
              ${['escopo_certificado', 'escopo_apostila_material', 'escopo_legendas', 'escopo_vinheta', 'escopo_site', 'escopo_midia_fisica'].some((k) => i[k] === 'incluido' || i[k] === 'adicional') ? `
                <p class="escopo-linha"><strong>Itens adicionais:</strong> ${[
                  ['incluido', 'adicional'].includes(i.escopo_certificado) ? `Certificado: ${ROTULO_INCLUSAO[i.escopo_certificado]}` : null,
                  ['incluido', 'adicional'].includes(i.escopo_apostila_material) ? `Apostila/material: ${ROTULO_INCLUSAO[i.escopo_apostila_material]}` : null,
                  ['incluido', 'adicional'].includes(i.escopo_legendas) ? `Legendas: ${ROTULO_INCLUSAO[i.escopo_legendas]}` : null,
                  ['incluido', 'adicional'].includes(i.escopo_vinheta) ? `Vinheta: ${ROTULO_INCLUSAO[i.escopo_vinheta]}` : null,
                  ['incluido', 'adicional'].includes(i.escopo_site) ? `Site profissional: ${ROTULO_INCLUSAO[i.escopo_site]}` : null,
                  ['incluido', 'adicional'].includes(i.escopo_midia_fisica) ? `Mídia física: ${ROTULO_INCLUSAO[i.escopo_midia_fisica]}` : null,
                ].filter(Boolean).map(escapeHtml).join(' · ')}</p>
              ` : ''}
              ${i.escopo_prazo_suporte_meses ? `<p class="escopo-linha"><strong>Suporte:</strong> ${i.escopo_prazo_suporte_meses} meses ${dadosContrato.suporte_inicio === 'assinatura' ? 'a partir da assinatura do contrato' : 'após a entrega'}, para orientação e auxílio operacional dentro deste escopo (não inclui novas gravações/regravações)</p>` : ''}
              ${i.escopo_exclusoes ? `<p class="escopo-linha"><strong>Não incluído neste plano:</strong> ${escapeHtml(i.escopo_exclusoes)}</p>` : ''}
              ${i.termos_contratuais ? `<p class="escopo-linha text-muted">${escapeHtml(i.termos_contratuais)}</p>` : ''}
            </div>
          `).join('') || '<p class="text-muted" style="font-size:13.5px;">O escopo detalhado deste contrato está descrito nas condições comerciais.</p>'}
        </div>
        <button class="btn btn-primary btn-block mt-4" id="btnProsseguirContrato">Ler o contrato completo</button>
      `;
      document.getElementById('btnProsseguirContrato').addEventListener('click', renderContratoCompleto);
    }

    function renderContratoCompleto() {
      const ctx = montarContextoJuridico({
        empresaNome: dadosContratada?.nome,
        contratadaDocumento: dadosContratada?.documento,
        contratadaEndereco: dadosContratada?.endereco,
        contratadaResponsavel: dadosContratada?.responsavel,
        contratadaResponsavelCpf: dadosContratada?.responsavelCpf,
        contratadaResponsavelCargo: dadosContratada?.responsavelCargo,
        clienteNomeCompleto: dadosPreenchidos.nome_completo,
        clienteCpfCnpj: dadosPreenchidos.cpf_cnpj,
        clienteEmpresaMarca: dadosPreenchidos.empresa_marca,
        clienteEndereco: [dadosPreenchidos.endereco_logradouro, dadosPreenchidos.endereco_numero, dadosPreenchidos.endereco_complemento, dadosPreenchidos.endereco_bairro, dadosPreenchidos.endereco_cidade, dadosPreenchidos.endereco_estado, dadosPreenchidos.endereco_cep].filter(Boolean).join(', '),
        itens: dadosContrato.itens,
        suporteInicio: dadosContrato.suporte_inicio,
        recorrencia: dadosContrato.recorrencia,
      });

      conteudo.innerHTML = `
        <div class="passo-label">Passo 4 de ${totalPassos()} — Contrato completo</div>
        <div class="card">
          <p style="font-size:13px; margin-bottom:10px;">Leia o contrato completo antes de prosseguir. Este é exatamente o texto que também vai compor o documento final (PDF).</p>
          <div class="contrato-texto">
            ${clausulasDoContrato(ctx).map((c) => `<h4>${escapeHtml(c.titulo)}</h4><p>${escapeHtml(c.texto(ctx))}</p>`).join('')}
          </div>
          ${dadosContratada?.assinatura ? `
          <div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--line-strong);">
            <span class="mono-label">CONTRATADA</span>
            <div style="background:#fff; border-radius:6px; padding:6px; margin-top:6px; max-width:240px;"><img src="${dadosContratada.assinatura.dataUrl}" alt="Assinatura da contratada" style="width:100%; height:auto; display:block;" /></div>
            <p class="text-muted" style="font-size:11.5px; margin-top:4px;">${escapeHtml(dadosContratada.nome)} — assinado eletronicamente em ${new Date(dadosContratada.assinatura.assinadoEm).toLocaleString('pt-BR')}</p>
          </div>` : ''}
        </div>
        <button class="btn btn-secondary btn-block mt-4" id="btnLerPdf">Ler em PDF (somente leitura, não assinado)</button>
        <button class="btn btn-primary btn-block mt-2" id="btnLi">Li e entendi — prosseguir</button>
      `;
      document.getElementById('btnLerPdf').addEventListener('click', async () => {
        const b = document.getElementById('btnLerPdf'); b.disabled = true; const t = b.textContent; b.textContent = 'Gerando PDF...';
        try {
          const blob = await gerarPdfPublico({ leitura: true });
          if (!blob) alert('Não foi possível gerar o PDF agora.'); else abrirPdf(blob, 'contrato-leitura.pdf', false);
        } catch { alert('Não foi possível gerar o PDF agora.'); }
        b.disabled = false; b.textContent = t;
      });
      document.getElementById('btnLi').addEventListener('click', () => renderConfirmacao(dadosPreenchidos));
    }

    function renderConfirmacao(dados) {
      conteudo.innerHTML = `
        <div class="passo-label">Passo 5 de ${totalPassos()} — Confirmação</div>
        <div class="card">
          <p style="font-size:14px; margin-bottom:8px;">Revise rapidamente:</p>
          <div class="resumo-linha"><span>Nome</span><span>${escapeHtml(dados.nome_completo)}</span></div>
          ${dados.empresa_marca ? `<div class="resumo-linha"><span>Empresa</span><span>${escapeHtml(dados.empresa_marca)}</span></div>` : ''}
          <div class="resumo-linha"><span>CPF/CNPJ</span><span>${escapeHtml(dados.cpf_cnpj)}</span></div>
          <div class="resumo-linha"><span>E-mail</span><span>${escapeHtml(dados.email)}</span></div>
          <div class="resumo-linha"><span>Endereço</span><span style="text-align:right; max-width:60%;">${escapeHtml([dados.endereco_logradouro, dados.endereco_numero, dados.endereco_cidade, dados.endereco_estado].filter(Boolean).join(', '))}</span></div>
          <div class="resumo-linha"><span>Valor negociado</span><span style="font-weight:800;">${formatarMoeda(dadosContrato.valor_negociado_total)}</span></div>
          <div class="check-linha mt-4"><input type="checkbox" id="cConfirmo" /><label for="cConfirmo" style="font-size:13.5px;">Confirmo que li o contrato completo, revisei meus dados e as condições apresentadas.</label></div>
          <button class="btn btn-primary btn-block mt-2" id="btnConfirmar" disabled>Confirmar e continuar</button>
        </div>
      `;
      document.getElementById('cConfirmo').addEventListener('change', (e) => {
        document.getElementById('btnConfirmar').disabled = !e.target.checked;
      });
      document.getElementById('btnConfirmar').addEventListener('click', async () => {
        const btn = document.getElementById('btnConfirmar');
        btn.disabled = true; btn.textContent = 'Confirmando...';
        try {
          const resp = await fetch(FUNCTION_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, acao: 'confirmar' }),
          });
          const body = await resp.json();
          if (!body.ok) {
            if (body.motivo === 'dados_incompletos') {
              alert('Alguns dados obrigatórios (incluindo endereço) ainda não foram preenchidos. Volte e complete o formulário.');
              btn.disabled = false; btn.textContent = 'Confirmar e continuar';
              return;
            }
            renderIndisponivel();
            return;
          }
          if (dadosContrato.recorrencia) renderPagamento(); else renderAssinatura();
        } catch {
          alert('Não foi possível confirmar agora. Tente novamente.');
          btn.disabled = false; btn.textContent = 'Confirmar e continuar';
        }
      });
    }

    async function reabrirDados() {
      if (!confirm('Voltar e corrigir seus dados? Você precisará confirmá-los de novo antes de assinar.')) return;
      try {
        const resp = await fetch(FUNCTION_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, acao: 'reabrir' }) });
        const body = await resp.json();
        if (!body.ok) {
          alert(body.motivo === 'pagamento_em_andamento'
            ? 'O pagamento já foi iniciado, então não é possível alterar os dados por aqui. Fale com a nossa equipe se algo estiver incorreto.'
            : 'Não foi possível voltar agora. Tente novamente.');
          return;
        }
        window.location.reload();
      } catch {
        alert('Não foi possível voltar agora. Tente novamente.');
      }
    }
    const LINK_VOLTAR = '<button type="button" class="btn-ghost btn-block mt-4" id="btnReabrirDados" style="font-size:12.5px; text-decoration:underline;">Voltar e corrigir meus dados</button>';
    function ligarVoltar() { const b = document.getElementById('btnReabrirDados'); if (b) b.addEventListener('click', reabrirDados); }

    async function chamarCheckout(acao, extra = {}) {
      const resp = await fetch(CHECKOUT_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, acao, ...extra }),
      });
      return resp.json();
    }

    const MSG_MOTIVO = {
      pagamento_nao_configurado: 'O pagamento recorrente ainda não está disponível neste momento. Nossa equipe entrará em contato para concluir a contratação.',
      recorrencia_ja_existente: 'Já existe uma assinatura para este contrato. Atualize a página para ver a situação.',
      falha_no_provedor: 'Não foi possível abrir o pagamento agora. Tente novamente em instantes.',
      email_do_cliente_ausente: 'Não encontramos o e-mail informado. Volte e confira seus dados.',
    };

    let pollingPagamento = 0;

    async function renderPagamento() {
      const rotulo = `Passo 6 de ${totalPassos()} — Pagamento`;
      conteudo.innerHTML = `<div class="passo-label">${rotulo}</div><div class="skeleton" style="height:160px;"></div>`;
      let st;
      try { st = await chamarCheckout('status'); } catch { st = null; }
      if (!st || !st.ok) { renderIndisponivel(); return; }

      const a = st.assinatura;
      const voltouDoCheckout = new URLSearchParams(window.location.search).get('pagamento') === 'retorno';

      if (!st.configurado && !a) {
        conteudo.innerHTML = `<div class="passo-label">${rotulo}</div><div class="card"><p style="font-size:14px; line-height:1.6;">${MSG_MOTIVO.pagamento_nao_configurado}</p></div>`;
        return;
      }

      if (a && a.status_financeiro === 'ativo') {
        if (st.assinou_contrato) {
          conteudo.innerHTML = `<div class="card" style="text-align:center;"><div style="font-size:32px; margin-bottom:12px;">✓</div><p style="font-size:15px; font-weight:700;">Contratação concluída</p><p class="text-muted mt-2" style="font-size:13.5px; line-height:1.6;">O pagamento recorrente foi confirmado e o contrato está assinado.</p></div>`;
        } else {
          renderAssinatura(true);
        }
        return;
      }

      if (a && (a.status_financeiro === 'pendente' || a.status_financeiro === 'inadimplente')) {
        conteudo.innerHTML = `<div class="passo-label">${rotulo}</div><div class="card"><p style="font-size:14px; line-height:1.6;">Há uma cobrança pendente para esta assinatura. Ela ainda não foi confirmada pelo Mercado Pago.</p><button class="btn btn-secondary btn-block mt-4" id="btnVerificar">Verificar novamente</button></div>`;
        document.getElementById('btnVerificar').addEventListener('click', renderPagamento);
        return;
      }

      if (a && a.status_financeiro === 'aguardando_pagamento' && a.tem_checkout) {
        conteudo.innerHTML = `
          <div class="passo-label">${rotulo}</div>
          <div class="card">
            <p style="font-size:14px; line-height:1.6;">${voltouDoCheckout ? 'Estamos aguardando a confirmação do Mercado Pago. Isso pode levar alguns instantes.' : 'Seu pagamento ainda não foi confirmado.'}</p>
            <button class="btn btn-secondary btn-block mt-4" id="btnVerificar">Verificar novamente</button>
            <button class="btn btn-primary btn-block mt-2" id="btnContinuarPagamento">Continuar para o pagamento</button>
            ${LINK_VOLTAR}
          </div>`;
        ligarVoltar();
        document.getElementById('btnVerificar').addEventListener('click', renderPagamento);
        document.getElementById('btnContinuarPagamento').addEventListener('click', () => iniciarPagamento(a.periodicidade));
        if (voltouDoCheckout && pollingPagamento < 12) { pollingPagamento += 1; setTimeout(renderPagamento, 5000); }
        return;
      }

      const v = st.valores || {};
      const cheioAnual = Number(v.mensal) * 12;
      const descontoAnual = cheioAnual > 0 && Number(v.anual) > 0 && Number(v.anual) < cheioAnual ? Math.round((1 - Number(v.anual) / cheioAnual) * 100) : 0;
      conteudo.innerHTML = `
        <div class="passo-label">${rotulo}</div>
        <div class="card">
          <p style="font-size:15px; font-weight:700; margin-bottom:6px;">Escolha como deseja contratar</p>
          <p class="text-muted" style="font-size:13px; line-height:1.6; margin-bottom:14px;">Manutenção e suporte para o seu site.</p>
          <button class="btn btn-primary btn-block" id="btnMensal">${formatarMoeda(v.mensal)} / mês</button>
          <button class="btn btn-secondary btn-block mt-2" id="btnAnual">${formatarMoeda(v.anual)} / ano${descontoAnual ? ` · economize ${descontoAnual}%` : ''}</button>
          <p class="text-muted mt-4" style="font-size:11.5px; line-height:1.6;">O pagamento é feito no ambiente seguro do Mercado Pago. Nós não armazenamos os dados do seu cartão. A contratação só é concluída depois da confirmação do pagamento pelo Mercado Pago.</p>
          ${LINK_VOLTAR}
        </div>`;
      ligarVoltar();
      document.getElementById('btnMensal').addEventListener('click', () => iniciarPagamento('mensal'));
      document.getElementById('btnAnual').addEventListener('click', () => iniciarPagamento('anual'));
    }

    async function iniciarPagamento(periodicidade) {
      try {
        const r = await chamarCheckout('iniciar', { periodicidade });
        if (r && r.ok && r.checkout_url) { window.location.href = r.checkout_url; return; }
        alert((r && MSG_MOTIVO[r.motivo]) || 'Não foi possível iniciar o pagamento agora.');
      } catch {
        alert('Não foi possível iniciar o pagamento agora. Tente novamente.');
      }
    }

    function renderAssinatura(pagamentoConfirmado) {
      conteudo.innerHTML = `
        <div class="passo-label">Passo ${totalPassos()} de ${totalPassos()} — Assinatura</div>
        <div class="card">
          ${pagamentoConfirmado ? '<p class="text-muted" style="font-size:12.5px; margin-bottom:10px;">✓ Pagamento recorrente confirmado pelo Mercado Pago.</p>' : ''}
          <p style="font-size:13.5px; margin-bottom:12px;">Desenhe sua assinatura na área abaixo (com o dedo no celular, ou com o mouse/trackpad no computador).</p>
          <div class="flex gap-2 mb-2">
            <input type="text" id="assinaturaTexto" placeholder="Ou digite seu nome para assinar em letra cursiva" style="flex:2;" />
            <select id="assinaturaFonte" style="flex:1;">${FONTES_ASSINATURA.map((f) => `<option value="${f.valor}">${f.label}</option>`).join('')}</select>
          </div>
          <canvas id="canvasAssinatura" style="width:100%; height:180px; background:#ffffff; border:1px solid var(--line-strong); border-radius:var(--radius); touch-action:none; cursor:crosshair;"></canvas>
          <div class="flex gap-2 mt-2">
            <button class="btn btn-secondary btn-sm" id="btnLimparAssinatura">Limpar</button>
            <button class="btn btn-primary btn-sm" id="btnConfirmarAssinatura" disabled style="flex:1;">Confirmar assinatura</button>
          </div>
          <p class="text-muted mt-4" style="font-size:11px; line-height:1.5;">
            Esta é uma assinatura eletrônica simples — evidência do seu aceite dentro deste fluxo, não uma assinatura digital
            certificada (ICP-Brasil) nem necessariamente equivalente a uma assinatura eletrônica qualificada.
          </p>
          ${pagamentoConfirmado ? '' : LINK_VOLTAR}
        </div>
      `;
      ligarVoltar();

      const canvas = document.getElementById('canvasAssinatura');
      const ctx2d = canvas.getContext('2d');
      // canvas em CSS pixels vs pixels reais -- ajusta pra desenho nitido
      // e coordenadas corretas em qualquer tamanho de tela.
      function ajustarTamanhoCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        ctx2d.lineWidth = 2.4;
        ctx2d.lineCap = 'round';
        ctx2d.lineJoin = 'round';
        // Tinta escura sobre fundo transparente -- o bitmap do canvas em si
        // nunca recebe um fillRect de fundo, então o PNG exportado
        // (toDataURL) sai com fundo transparente e traço escuro, como uma
        // assinatura a caneta sobre papel branco quando colada no PDF
        // (que já é branco). O <canvas style background:#fff> acima é só
        // a cor de visualização em tela, não faz parte do bitmap exportado.
        ctx2d.strokeStyle = '#12141a';
      }
      ajustarTamanhoCanvas();
      garantirFontesAssinatura();

      let desenhando = false;
      let temTraco = false;

      function posicao(evento) {
        const rect = canvas.getBoundingClientRect();
        const ponto = evento.touches ? evento.touches[0] : evento;
        return { x: ponto.clientX - rect.left, y: ponto.clientY - rect.top };
      }
      function iniciar(evento) {
        evento.preventDefault();
        desenhando = true;
        const p = posicao(evento);
        ctx2d.beginPath();
        ctx2d.moveTo(p.x, p.y);
      }
      function mover(evento) {
        if (!desenhando) return;
        evento.preventDefault();
        const p = posicao(evento);
        ctx2d.lineTo(p.x, p.y);
        ctx2d.stroke();
        if (!temTraco) { temTraco = true; document.getElementById('btnConfirmarAssinatura').disabled = false; }
      }
      function parar() { desenhando = false; }

      async function atualizarAssinaturaDigitada() {
        const desenhou = await desenharTextoNoCanvas(canvas, document.getElementById('assinaturaTexto').value, document.getElementById('assinaturaFonte').value);
        temTraco = desenhou;
        document.getElementById('btnConfirmarAssinatura').disabled = !desenhou;
      }
      document.getElementById('assinaturaTexto').addEventListener('input', atualizarAssinaturaDigitada);
      document.getElementById('assinaturaFonte').addEventListener('change', atualizarAssinaturaDigitada);

      canvas.addEventListener('mousedown', iniciar);
      canvas.addEventListener('mousemove', mover);
      window.addEventListener('mouseup', parar);
      canvas.addEventListener('touchstart', iniciar, { passive: false });
      canvas.addEventListener('touchmove', mover, { passive: false });
      canvas.addEventListener('touchend', parar);

      document.getElementById('btnLimparAssinatura').addEventListener('click', () => {
        ctx2d.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('assinaturaTexto').value = '';
        temTraco = false;
        document.getElementById('btnConfirmarAssinatura').disabled = true;
      });

      document.getElementById('btnConfirmarAssinatura').addEventListener('click', async () => {
        const btn = document.getElementById('btnConfirmarAssinatura');
        btn.disabled = true; btn.textContent = 'Enviando...';
        try {
          const imagemBase64 = canvas.toDataURL('image/png');
          const resp = await fetch(FUNCTION_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, acao: 'assinar', imagem: imagemBase64 }),
          });
          const body = await resp.json();
          if (!body.ok) { if (body.motivo === 'pagamento_pendente') { alert('O pagamento ainda não foi confirmado pelo Mercado Pago.'); renderPagamento(); return; } renderIndisponivel(); return; }
          conteudo.innerHTML = `
            <div class="card" style="text-align:center;">
              <div style="font-size:32px; margin-bottom:12px;">✓</div>
              <p style="font-size:15px; font-weight:700;">Assinatura registrada com sucesso!</p>
              <p class="text-muted mt-2" style="font-size:13.5px; line-height:1.6;">Agora é só aguardar os próximos passos da equipe Criativamente para a validação final do contrato.</p>
              <button class="btn btn-primary btn-block mt-4" id="btnBaixarAssinado">Salvar contrato em PDF (versão assinada)</button>
              <p class="text-muted mt-2" style="font-size:11.5px; line-height:1.5;">Guarde este arquivo. A versão oficial também fica registrada com a Criativamente.</p>
            </div>
          `;
          document.getElementById('btnBaixarAssinado').addEventListener('click', async () => {
            const b = document.getElementById('btnBaixarAssinado'); b.disabled = true; const t = b.textContent; b.textContent = 'Gerando PDF...';
            try {
              const blob = await gerarPdfPublico({ leitura: false, assinaturaCliente: imagemBase64 });
              if (!blob) alert('Não foi possível gerar o PDF agora. Solicite a segunda via ao final do prazo.'); else abrirPdf(blob, 'contrato-assinado.pdf', true);
            } catch { alert('Não foi possível gerar o PDF agora.'); }
            b.disabled = false; b.textContent = t;
          });
        } catch {
          alert('Não foi possível registrar a assinatura agora. Tente novamente.');
          btn.disabled = false; btn.textContent = 'Confirmar assinatura';
        }
      });
    }
  </script>
</body>
</html>
