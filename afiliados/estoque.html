<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estoque — PromoWhats</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/afiliados/styles/tokens.css" />
  <link rel="stylesheet" href="/afiliados/styles/components.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarContainer"></div>
    <div class="main">
      <div class="topbar">
        <div>
          <div class="pagetitle">Estoque de ofertas</div>
          <div class="pagesub">O que o radar encontrou, o que está pronto, o que já saiu</div>
        </div>
        <div class="cyclepill"><span class="dot" id="statusDot"></span><span id="resumo">carregando…</span></div>
      </div>

      <div class="filters" id="filtrosStatus"></div>
      <div class="filters" id="filtrosGrupo"></div>
      <div class="filters" id="filtrosMarketplace"></div>

      <div class="card" id="lista"><div class="empty-state">Carregando ofertas do Supabase…</div></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/src/lib/supabaseClient.js';
    import { requireSession, handleQueryError } from '/src/lib/session.js';
    import { renderSidebar } from '/afiliados/lib/sidebar.js';
    import { money, statusLabel, statusPillClass, marketplaceLabel, resolvableImageUrl } from '/afiliados/lib/format.js';
    import { ICON_PHOTO } from '/afiliados/lib/icons.js';

    const session = await requireSession();
    if (!session) throw new Error('sem sessão');
    renderSidebar(document.getElementById('sidebarContainer'), { paginaAtual: 'estoque.html', usuarioEmail: session.user.email });

    const db = supabase.schema('afiliados');
    let TODAS = [];
    let filtroStatus = 'TODOS';
    let filtroGrupo = 'TODOS';
    let filtroMarketplace = 'TODOS';

    const { data, error } = await db.from('ofertas').select('*').order('created_at', { ascending: false });

    if (error) {
      if (await handleQueryError(error)) { /* redirecionou */ }
      else {
        document.getElementById('lista').innerHTML = `<div class="empty-state">Não foi possível carregar o estoque: ${error.message}</div>`;
        document.getElementById('resumo').textContent = 'erro ao carregar';
      }
    } else {
      TODAS = data || [];
      renderFiltros();
      renderLista();
      document.getElementById('statusDot').className = 'dot';
    }

    function renderFiltros() {
      const statuses = ['TODOS', ...new Set(TODAS.map(o => o.status).filter(Boolean))];
      const grupos = ['TODOS', ...new Set(TODAS.map(o => o.grupo_destino).filter(Boolean))];
      const marketplaces = ['TODOS', ...new Set(TODAS.map(o => o.marketplace).filter(Boolean))];

      document.getElementById('filtrosStatus').innerHTML = statuses.map(s =>
        `<div class="chip ${s === filtroStatus ? 'on' : ''}" data-kind="status" data-val="${s}">${s === 'TODOS' ? 'Todos os status' : statusLabel(s)}</div>`
      ).join('');
      document.getElementById('filtrosGrupo').innerHTML = grupos.map(g =>
        `<div class="chip ${g === filtroGrupo ? 'on' : ''}" data-kind="grupo" data-val="${g}">${g === 'TODOS' ? 'Todos os grupos' : g}</div>`
      ).join('');
      document.getElementById('filtrosMarketplace').innerHTML = marketplaces.map(m =>
        `<div class="chip ${m === filtroMarketplace ? 'on' : ''}" data-kind="mp" data-val="${m}">${m === 'TODOS' ? 'Todos os marketplaces' : marketplaceLabel(m)}</div>`
      ).join('');

      document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const { kind, val } = chip.dataset;
          if (kind === 'status') filtroStatus = val;
          if (kind === 'grupo') filtroGrupo = val;
          if (kind === 'mp') filtroMarketplace = val;
          renderFiltros();
          renderLista();
        });
      });
    }

    function renderLista() {
      const filtradas = TODAS.filter(o =>
        (filtroStatus === 'TODOS' || o.status === filtroStatus) &&
        (filtroGrupo === 'TODOS' || o.grupo_destino === filtroGrupo) &&
        (filtroMarketplace === 'TODOS' || o.marketplace === filtroMarketplace)
      );

      document.getElementById('resumo').textContent = `${TODAS.length} no estoque · ${filtradas.length} exibidas`;

      if (filtradas.length === 0) {
        document.getElementById('lista').innerHTML = '<div class="empty-state">Nenhuma oferta com esses filtros — sem dados.</div>';
        return;
      }

      document.getElementById('lista').innerHTML = filtradas.map(o => {
        const img = resolvableImageUrl(o.imagem_url);
        const thumb = img ? `<img src="${img}" alt="">` : ICON_PHOTO;
        return `
        <div class="list-row">
          <div class="thumb">${thumb}</div>
          <div class="rowmain">
            <div class="rowtitle">${escapeHtml(o.produto)}</div>
            <div class="rowmeta">
              <span class="badge ${o.marketplace === 'shopee' ? 'shp' : 'ml'}">${marketplaceLabel(o.marketplace)}</span>
              <span>${o.nicho || '—'}</span>
              ${o.calculated_discount != null ? `<span>${o.calculated_discount}% off</span>` : ''}
              <span>★ ${o.avaliacao ?? '—'} (${o.num_avaliacoes ?? '—'})</span>
            </div>
          </div>
          <div class="price">${o.preco_anterior ? `<span class="price-old">${money(o.preco_anterior)}</span>` : ''}${money(o.preco_atual)}</div>
          ${o.score_oferta != null ? `<div class="score">${o.score_oferta}</div>` : '<div style="width:38px"></div>'}
          <div class="pill ${statusPillClass(o.status)}">${statusLabel(o.status)}</div>
        </div>`;
      }).join('');
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s ?? '';
      return d.innerHTML;
    }
  </script>
</body>
</html>
