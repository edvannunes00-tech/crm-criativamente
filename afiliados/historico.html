<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Histórico — PromoWhats</title>
  <link rel="icon" type="image/svg+xml" href="/afiliados/favicon.svg" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/afiliados/styles/tokens.css" />
  <link rel="stylesheet" href="/afiliados/styles/components.css" />
  <style>
    .metricas-manuais { display:flex; align-items:center; gap:10px; margin-top:6px; }
    .metricas-manuais label { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-muted); }
    .metricas-manuais input {
      width:64px; padding:3px 6px; border-radius:var(--radius); border:0.5px solid var(--border-strong);
      background:var(--surface-2); font-size:12px; font-family:var(--font-mono); text-align:right;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarContainer"></div>
    <div class="main">
      <div class="topbar">
        <div>
          <div class="pagetitle">Histórico</div>
          <div class="pagesub">Publicações, erros e rejeições — direto de afiliados.ofertas</div>
        </div>
        <div class="cyclepill"><span class="dot" id="statusDot"></span><span id="resumo">carregando…</span></div>
      </div>

      <div class="filters" id="filtroStatus"></div>
      <div class="filters" id="filtroPeriodo"></div>
      <div class="filters" id="filtroGrupo"></div>
      <div class="filters" id="filtroMarketplace"></div>

      <div class="card" style="padding:10px 16px; margin-bottom:1rem; font-size:12.5px; color:var(--ink-2);">
        Cliques, itens vendidos e comissão são <b>preenchidos manualmente</b> (confira no painel <span class="mono">affiliate.shopee.com.br</span>) — acesso à API oficial de afiliados ainda pendente de aprovação da Shopee.
      </div>
      <div class="kpirow" id="kpisManuais"></div>
      <div class="card" id="lista"><div class="empty-state">Carregando histórico…</div></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/src/lib/supabaseClient.js';
    import { requireSession, handleQueryError } from '/src/lib/session.js';
    import { renderSidebar } from '/afiliados/lib/sidebar.js';
    import { money, marketplaceLabel, dateFromEpoch, statusLabel, statusPillClass, melhorTimestamp, motivoRelevante } from '/afiliados/lib/format.js';
    import { ICON_PHOTO } from '/afiliados/lib/icons.js';

    const session = await requireSession();
    if (!session) throw new Error('sem sessão');
    renderSidebar(document.getElementById('sidebarContainer'), { paginaAtual: 'historico.html', usuarioEmail: session.user.email });

    const db = supabase.schema('afiliados');
    const STATUS_HISTORICO = ['PUBLISHED', 'FAILED', 'EXPIRED', 'REJECTED'];
    let TODAS = [];
    let filtroStatus = 'TODOS';
    let filtroPeriodo = 'TODOS';
    let filtroGrupo = 'TODOS';
    let filtroMarketplace = 'TODOS';

    const { data, error } = await db.from('ofertas').select('*').in('status', STATUS_HISTORICO);

    const dot = document.getElementById('statusDot');
    if (error) {
      if (await handleQueryError(error)) { /* redirecionou */ }
      else {
        document.getElementById('lista').innerHTML = `<div class="empty-state">Não foi possível carregar o histórico: ${error.message}</div>`;
        document.getElementById('resumo').textContent = 'erro ao carregar';
      }
    } else {
      dot.className = 'dot';
      TODAS = (data || []).sort((a, b) => (melhorTimestamp(b) ?? 0) - (melhorTimestamp(a) ?? 0));
      renderFiltros();
      renderLista();
    }

    function renderFiltros() {
      const grupos = ['TODOS', ...new Set(TODAS.map(o => o.grupo_destino).filter(Boolean))];
      const marketplaces = ['TODOS', ...new Set(TODAS.map(o => o.marketplace).filter(Boolean))];

      document.getElementById('filtroStatus').innerHTML = ['TODOS', ...STATUS_HISTORICO].map(s =>
        `<div class="chip ${s === filtroStatus ? 'on' : ''}" data-kind="status" data-val="${s}">${s === 'TODOS' ? 'Tudo' : statusLabel(s)}</div>`
      ).join('');
      document.getElementById('filtroPeriodo').innerHTML = ['TODOS', '7', '30'].map(p =>
        `<div class="chip ${p === filtroPeriodo ? 'on' : ''}" data-kind="periodo" data-val="${p}">${p === 'TODOS' ? 'Todo o período' : `Últimos ${p} dias`}</div>`
      ).join('');
      document.getElementById('filtroGrupo').innerHTML = grupos.map(g =>
        `<div class="chip ${g === filtroGrupo ? 'on' : ''}" data-kind="grupo" data-val="${g}">${g === 'TODOS' ? 'Todos os grupos' : g}</div>`
      ).join('');
      document.getElementById('filtroMarketplace').innerHTML = marketplaces.map(m =>
        `<div class="chip ${m === filtroMarketplace ? 'on' : ''}" data-kind="mp" data-val="${m}">${m === 'TODOS' ? 'Todos os marketplaces' : marketplaceLabel(m)}</div>`
      ).join('');

      document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const { kind, val } = chip.dataset;
          if (kind === 'status') filtroStatus = val;
          if (kind === 'periodo') filtroPeriodo = val;
          if (kind === 'grupo') filtroGrupo = val;
          if (kind === 'mp') filtroMarketplace = val;
          renderFiltros();
          renderLista();
        });
      });
    }

    function renderLista() {
      const agora = Date.now() / 1000;
      const filtradas = TODAS.filter(o => {
        if (filtroStatus !== 'TODOS' && o.status !== filtroStatus) return false;
        if (filtroPeriodo !== 'TODOS') {
          const dias = Number(filtroPeriodo);
          const ts = melhorTimestamp(o);
          if (!ts || (agora - ts) > dias * 86400) return false;
        }
        if (filtroGrupo !== 'TODOS' && o.grupo_destino !== filtroGrupo) return false;
        if (filtroMarketplace !== 'TODOS' && o.marketplace !== filtroMarketplace) return false;
        return true;
      });

      const publicadas = TODAS.filter(o => o.status === 'PUBLISHED').length;
      document.getElementById('resumo').textContent = `${publicadas} publicadas · ${TODAS.length} no total · ${filtradas.length} exibidas`;
      renderKpisManuais(filtradas.filter(o => o.status === 'PUBLISHED'));

      if (filtradas.length === 0) {
        document.getElementById('lista').innerHTML = '<div class="empty-state">Nenhum registro com esses filtros — sem dados.</div>';
        return;
      }

      document.getElementById('lista').innerHTML = filtradas.map(o => {
        const motivo = motivoRelevante(o);
        return `
        <div class="list-row">
          <div class="thumb">${ICON_PHOTO}</div>
          <div class="rowmain">
            <div class="rowtitle">${o.produto}</div>
            <div class="rowmeta">
              <span class="badge ${o.marketplace === 'shopee' ? 'shp' : 'ml'}">${marketplaceLabel(o.marketplace)}</span>
              <span>${o.grupo_destino || '—'}</span>
              ${o.calculated_discount != null ? `<span>${o.calculated_discount}% off</span>` : ''}
              <span>${dateFromEpoch(melhorTimestamp(o))}</span>
              ${motivo ? `<span style="color:var(--danger)">${motivo}</span>` : ''}
            </div>
            ${o.status === 'PUBLISHED' ? `
            <div class="metricas-manuais">
              <label>Cliques <input type="number" min="0" step="1" data-metrica="cliques" data-id="${o.id}" value="${o.cliques ?? ''}" placeholder="—" /></label>
              <label>Vendidos <input type="number" min="0" step="1" data-metrica="itens_vendidos" data-id="${o.id}" value="${o.itens_vendidos ?? ''}" placeholder="—" /></label>
              <label>Comissão R$ <input type="number" min="0" step="0.01" data-metrica="comissao_confirmada" data-id="${o.id}" value="${o.comissao_confirmada ?? ''}" placeholder="—" /></label>
              ${o.metricas_atualizado_em ? `<span style="font-size:11px; color:var(--ink-muted)">atualizado ${new Date(o.metricas_atualizado_em).toLocaleDateString('pt-BR')}</span>` : ''}
            </div>` : ''}
          </div>
          <div class="price">${money(o.preco_atual)}</div>
          ${['REJECTED', 'FAILED', 'EXPIRED'].includes(o.status) ? `<button class="btn primary" data-reaprovar="${o.id}" style="padding:4px 10px; font-size:11.5px;">Aprovar</button>` : ''}
          <div class="pill ${statusPillClass(o.status)}">${statusLabel(o.status)}</div>
        </div>`;
      }).join('');

      document.querySelectorAll('[data-reaprovar]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const o = TODAS.find(x => x.id === btn.dataset.reaprovar);
          if (!o || !confirm('Aprovar esta oferta? Ela vai para aguardando publicação (o worker revalida preço/disponibilidade antes de publicar).')) return;
          btn.disabled = true;
          const { error } = await db.rpc('aprovar_oferta', { p_oferta_id: o.id, p_status_esperado: o.status });
          if (error) { btn.disabled = false; toast('err', (error.message || '').includes('CONFLITO_ESTADO') ? 'A oferta já foi alterada por outro processo — recarregue a página.' : 'Erro: ' + error.message); return; }
          TODAS = TODAS.filter(x => x.id !== o.id);
          toast('ok', 'Oferta aprovada — aguardando publicação.');
          renderFiltros();
          renderLista();
        });
      });

      document.querySelectorAll('[data-metrica]').forEach(input => {
        input.addEventListener('change', async () => {
          const campo = input.dataset.metrica;
          const id = input.dataset.id;
          const valor = input.value === '' ? null : Number(input.value);
          if (valor !== null && (Number.isNaN(valor) || valor < 0)) {
            toast('err', 'Valor inválido.');
            return;
          }
          const { error } = await db.from('ofertas').update({ [campo]: valor, metricas_atualizado_em: new Date().toISOString() }).eq('id', id);
          if (error) { toast('err', 'Erro ao salvar: ' + error.message); return; }
          const o = TODAS.find(x => x.id === id);
          if (o) { o[campo] = valor; o.metricas_atualizado_em = new Date().toISOString(); }
          toast('ok', 'Salvo.');
        });
      });
    }

    function renderKpisManuais(publicadasFiltradas) {
      const comDado = publicadasFiltradas.filter(o => o.cliques != null || o.itens_vendidos != null || o.comissao_confirmada != null);
      const somaCliques = publicadasFiltradas.reduce((s, o) => s + (o.cliques ?? 0), 0);
      const somaVendidos = publicadasFiltradas.reduce((s, o) => s + (o.itens_vendidos ?? 0), 0);
      const somaComissao = publicadasFiltradas.reduce((s, o) => s + (o.comissao_confirmada ?? 0), 0);
      document.getElementById('kpisManuais').innerHTML = `
        <div class="kpi"><div class="kpi-label">Cliques (preenchidos)</div><div class="kpi-value">${somaCliques}</div></div>
        <div class="kpi"><div class="kpi-label">Itens vendidos (preenchidos)</div><div class="kpi-value">${somaVendidos}</div></div>
        <div class="kpi"><div class="kpi-label">Comissão confirmada</div><div class="kpi-value">${money(somaComissao)}</div></div>
        <div class="kpi"><div class="kpi-label">Publicadas com dado manual</div><div class="kpi-value">${comDado.length}/${publicadasFiltradas.length}</div></div>
      `;
    }

    function toast(kind, msg) {
      const container = document.body;
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed; bottom:20px; right:20px; padding:10px 16px; border-radius:8px; font-size:13px; z-index:60; box-shadow:0 2px 10px rgba(0,0,0,.08);';
      el.style.background = kind === 'ok' ? 'var(--ok-soft)' : 'var(--danger-soft)';
      el.style.color = kind === 'ok' ? 'var(--ok)' : 'var(--danger)';
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }
  </script>
</body>
</html>
