<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha do Contrato — CRM Criativamente</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <style>
    .item-linha { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .item-linha:last-child { border-bottom: none; }
    @media (max-width: 720px) {
      .item-linha { display: grid !important; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
      .item-linha > div { flex: none !important; min-width: 0; }
      .item-linha > div:first-child { grid-column: 1 / -1; font-weight: 700; }
      .item-linha .btn-icone { grid-column: 1 / -1; justify-self: end; }
    }
    .resumo-linha { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; border-bottom: 1px solid var(--line); }
    .resumo-linha:last-child { border-bottom: none; font-weight: 800; font-size: 15px; }
    .link-token-box { background: var(--near-black); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 12px; font-family: var(--font-mono); font-size: 12px; word-break: break-all; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarContainer"></div>
    <div class="main-area">
      <div id="headerContainer"></div>
      <div class="page-content">

        <div id="cabecalho"><div class="skeleton" style="height:90px;"></div></div>
        <div id="blocoRecorrencia"></div>

        <div class="tabs" id="tabsNav">
          <button class="tab active" data-tab="comercial">Comercial</button>
          <button class="tab" data-tab="documento">Documento</button>
          <button class="tab" data-tab="link">Link Público</button>
          <button class="tab" data-tab="assinatura">Assinatura</button>
          <button class="tab" data-tab="timeline">Timeline</button>
        </div>

        <div id="tabContent"><div class="skeleton skeleton-row"></div></div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module">
    import { supabase } from '/src/lib/supabaseClient.js';
    import { handleQueryError, podeFazer } from '/src/lib/session.js';
    import { initPage } from '/src/lib/pageInit.js';
    import { formatarMoeda, formatarData, escapeHtml } from '/src/lib/format.js';
    import { gerarPdfContrato, salvarDocumentoContrato, carregarLogoDataUrl } from '/src/lib/contratoPdf.js';
    import { gerarLinkContrato, revogarLinkContrato, abrirLinkContrato, chamarFunction, assinarContratadaContrato } from '/src/lib/contratoLinks.js';
    import { CONDICOES_PAGAMENTO, PERCENTUAIS_ENTRADA_PRESET, FORMAS_PAGAMENTO, PERIODICIDADES, montarResumoCondicaoPagamento, sugerirCondicaoPorFaixa } from '/src/lib/condicoesPagamento.js';
    import { mascararTelefone, whatsappLink } from '/src/lib/format.js';
    import { renderBlocoRecorrencia } from '/src/lib/recorrenciaUi.js';
    import { FONTES_ASSINATURA, garantirFontesAssinatura, desenharTextoNoCanvas } from '/src/lib/assinaturaTexto.js';

    const { session, perm } = await initPage({ paginaAtual: 'contratos.html', breadcrumb: 'CRM / Contratos / Ficha', title: 'Ficha do Contrato' });
    const empresaId = perm ? perm.empresa_id : null;
    const usuarioId = session.user.id;
    const podeEditar = podeFazer(perm, 'contratos', 'editar');
    const podeAdministrar = podeFazer(perm, 'contratos', 'administrar');
    const podeExcluir = podeFazer(perm, 'contratos', 'excluir');

    const params = new URLSearchParams(window.location.search);
    const contratoId = params.get('id');
    if (!contratoId) {
      document.getElementById('cabecalho').innerHTML = `<div class="error-state"><p>Nenhum contrato indicado na URL.</p></div>`;
      throw new Error('sem id');
    }

    const STATUS_LABEL = {
      rascunho: 'Rascunho', enviado: 'Enviado', aguardando_assinatura: 'Aguardando assinatura',
      assinado: 'Assinado', validado: 'Validado', cancelado: 'Cancelado',
    };
    const STATUS_BADGE = {
      rascunho: 'dot-neutro', enviado: 'dot-info', aguardando_assinatura: 'dot-info',
      assinado: 'dot-sucesso', validado: 'dot-sucesso', cancelado: 'dot-erro',
    };

    let contrato = null;
    let contato = null;
    const editavel = () => contrato && podeEditar && contrato.status !== 'validado' && contrato.status !== 'cancelado';

    async function recalcularTotais() {
      const { data: itens } = await supabase.from('contrato_itens').select('valor_tabela_unitario, valor_negociado_unitario, valor_total, quantidade').eq('contrato_id', contratoId);
      const lista = itens || [];
      const valorTabela = lista.reduce((s, i) => s + Number(i.valor_tabela_unitario) * Number(i.quantidade), 0);
      const valorNegociado = lista.reduce((s, i) => s + Number(i.valor_total || 0), 0);
      await supabase.from('contratos').update({
        valor_tabela_total: valorTabela,
        valor_negociado_total: valorNegociado,
        desconto_total: valorTabela - valorNegociado,
      }).eq('id', contratoId);
    }

    async function carregarCabecalho() {
      const { data, error } = await supabase.from('contratos').select('*, contatos(id, nome, cpf_cnpj, whatsapp, email, empresa_marca)').eq('id', contratoId).maybeSingle();
      if (error) { if (await handleQueryError(error)) return; document.getElementById('cabecalho').innerHTML = `<div class="error-state"><p>Não foi possível carregar este contrato.</p></div>`; return; }
      if (!data) { document.getElementById('cabecalho').innerHTML = `<div class="error-state"><p>Contrato não encontrado — ou você não tem acesso a ele.</p></div>`; return; }

      contrato = data;
      contato = data.contatos || {};
      document.getElementById('headerContainer').querySelector('.header-title').textContent = data.titulo;

      const podeCancelar = (podeEditar || podeAdministrar) && !['cancelado'].includes(data.status) && data.status !== 'rascunho';
      const podeExcluirRascunho = podeExcluir && data.status === 'rascunho';
      const podeRegistrarEnvio = editavel() && ['rascunho', 'enviado'].includes(data.status);

      document.getElementById('cabecalho').innerHTML = `
        <div class="card" style="margin-bottom:24px;">
          <div class="cab-linha mb-4">
            <div>
              <div style="font-size:20px; font-weight:800;">${escapeHtml(data.titulo)}</div>
              <div class="text-muted mt-1" style="font-size:13px;">
                Cliente: <a href="/ficha-cliente.html?id=${contato.id}" style="color:var(--white); text-decoration:underline;">${escapeHtml(contato.nome || '—')}</a>
                ${data.oportunidade_id ? ` &nbsp;·&nbsp; <a href="/ficha-oportunidade.html?id=${data.oportunidade_id}" style="color:var(--white); text-decoration:underline;">Ver oportunidade</a>` : ''}
                ${data.projeto_id ? ` &nbsp;·&nbsp; <a href="/ficha-projeto.html?id=${data.projeto_id}" style="color:var(--white); text-decoration:underline;">Ver projeto</a>` : ''}
              </div>
            </div>
            <div class="cab-acoes">
              <span class="badge ${STATUS_BADGE[data.status] || 'dot-neutro'}"><span class="dot"></span>${STATUS_LABEL[data.status] || data.status}</span>
              ${podeRegistrarEnvio ? `<button class="btn btn-secondary btn-sm" id="btnRegistrarEnvio">Registrar envio</button>` : ''}
              ${podeCancelar ? `<button class="btn btn-secondary btn-sm" id="btnCancelar" style="color:var(--status-erro);">Cancelar contrato</button>` : ''}
              ${podeExcluirRascunho ? `<button class="btn btn-secondary btn-sm" id="btnExcluirContrato" style="color:var(--status-erro);">Excluir rascunho</button>` : ''}
            </div>
          </div>
          <div class="indicator-grid">
            <div class="indicator-card"><div class="label mono-label">Preço de tabela</div><div class="value" style="font-size:18px;">${formatarMoeda(data.valor_tabela_total)}</div></div>
            <div class="indicator-card"><div class="label mono-label">Desconto</div><div class="value" style="font-size:18px;">${formatarMoeda(data.desconto_total)}</div></div>
            <div class="indicator-card"><div class="label mono-label">Valor negociado</div><div class="value">${formatarMoeda(data.valor_negociado_total)}</div></div>
          </div>
        </div>
      `;

      if (podeCancelar) document.getElementById('btnCancelar').addEventListener('click', cancelarContrato);
      if (podeExcluirRascunho) document.getElementById('btnExcluirContrato').addEventListener('click', excluirContratoRascunho);
      if (podeRegistrarEnvio) document.getElementById('btnRegistrarEnvio').addEventListener('click', registrarEnvio);
    }

    // Excluir so e permitido em rascunho -- nesse estagio, tudo que
    // pertence ao contrato (itens/bonus/links/dados_cliente/versoes) ja
    // cascade automaticamente pela FK. documentos e polimorfico (sem FK),
    // entao limpamos explicitamente so os que sao exclusivamente deste
    // contrato antes de apagar o registro principal.
    async function excluirContratoRascunho() {
      if (!confirm(`Excluir definitivamente o rascunho "${contrato.titulo}"? Essa ação não pode ser desfeita.`)) return;
      await supabase.from('documentos').delete().eq('entidade_tipo', 'contrato').eq('entidade_id', contratoId);
      const { error } = await supabase.from('contratos').delete().eq('id', contratoId);
      if (error) {
        alert('Não foi possível excluir: ' + error.message);
        return;
      }
      window.location.href = '/contratos.html';
    }

    async function cancelarContrato() {
      const motivo = prompt('Motivo do cancelamento (opcional):') || null;
      if (!confirm('Cancelar este contrato? Essa ação altera o status para "Cancelado".')) return;
      const { error } = await supabase.from('contratos').update({ status: 'cancelado', motivo_cancelamento: motivo, cancelado_por: usuarioId, cancelado_em: new Date().toISOString() }).eq('id', contratoId);
      if (error) { alert('Não foi possível cancelar: ' + error.message); return; }
      await supabase.from('atividades').insert({ empresa_id: empresaId, contrato_id: contratoId, tipo: 'contrato_cancelado', titulo: 'Contrato cancelado', usuario_id: usuarioId, descricao: motivo });
      await carregarCabecalho();
      await abrirAba(document.querySelector('#tabsNav .tab.active').dataset.tab);
    }

    async function registrarEnvio() {
      const canal = prompt('Canal de envio: whatsapp, email, ambos ou outro?', 'whatsapp');
      if (!canal) return;
      const destinatario = prompt('Destinatário (opcional):') || null;
      const observacao = prompt('Observação (opcional):') || null;
      await supabase.from('atividades').insert({
        empresa_id: empresaId, contrato_id: contratoId, tipo: 'contrato_enviado',
        titulo: `Contrato enviado (${canal})`, usuario_id: usuarioId,
        descricao: observacao, metadata: { canal, destinatario },
      });
      if (contrato.status === 'rascunho') {
        await supabase.from('contratos').update({ status: 'enviado' }).eq('id', contratoId);
      }
      await carregarCabecalho();
      await abrirAba('timeline');
    }

    // ==================== ABA COMERCIAL ====================
    async function abaComercial() {
      const [{ data: itens }, { data: bonusLista }, { data: produtos }] = await Promise.all([
        supabase.from('contrato_itens').select('*, produtos_servicos(nome)').eq('contrato_id', contratoId).order('created_at'),
        supabase.from('contrato_bonus').select('*').eq('contrato_id', contratoId).order('created_at'),
        supabase.from('produtos_servicos').select('id, nome, preco_padrao').eq('empresa_id', empresaId).eq('ativo', true).order('nome'),
      ]);

      const podeMexer = editavel();

      const itensHtml = (itens || []).map((i) => `
        <div class="item-linha">
          <div style="flex:2;">${escapeHtml((i.produtos_servicos && i.produtos_servicos.nome) || i.descricao || '—')}</div>
          <div style="flex:1;">Qtd ${i.quantidade}</div>
          <div style="flex:1;">Tabela ${formatarMoeda(i.valor_tabela_unitario)}</div>
          <div style="flex:1;">Negociado ${formatarMoeda(i.valor_negociado_unitario)}</div>
          <div style="flex:1; font-weight:700;">${formatarMoeda(i.valor_total)}</div>
          ${podeMexer ? `<button class="btn-icone" data-remover-item="${i.id}" title="Remover">✕</button>` : ''}
        </div>
      `).join('') || `<div class="empty-state"><p>Nenhum item ainda.</p></div>`;

      const bonusHtml = (bonusLista || []).map((b) => `
        <div class="item-linha">
          <div style="flex:3;">${escapeHtml(b.descricao)}${b.quantidade ? ` (x${b.quantidade})` : ''}</div>
          ${podeMexer ? `<button class="btn-icone" data-remover-bonus="${b.id}" title="Remover">✕</button>` : ''}
        </div>
      `).join('') || `<div class="empty-state"><p>Nenhum bônus adicionado.</p></div>`;

      return `
        <div class="card mb-4">
          <div class="flex items-center justify-between mb-4"><span class="mono-label">Itens do contrato</span></div>
          ${itensHtml}
          ${podeMexer ? `
            <form id="formNovoItem" class="flex gap-2 mt-4" style="flex-wrap:wrap;">
              <select id="itProduto" style="flex:2; min-width:160px;"><option value="">Item avulso...</option>${(produtos || []).map((p) => `<option value="${p.id}" data-preco="${p.preco_padrao || 0}">${escapeHtml(p.nome)} — ${formatarMoeda(p.preco_padrao)}</option>`).join('')}</select>
              <input type="text" id="itDescricao" placeholder="Descrição (se avulso)" style="flex:2; min-width:140px;" />
              <input type="number" id="itQtd" value="1" min="1" step="1" style="width:70px;" />
              <input type="text" id="itTabela" placeholder="Vlr. tabela" style="width:100px;" />
              <input type="text" id="itNegociado" placeholder="Vlr. negociado" style="width:100px;" />
              <input type="text" id="itDesconto" placeholder="Desconto" value="0" style="width:90px;" />
              <button type="submit" class="btn btn-primary btn-sm">Adicionar item</button>
            </form>
          ` : ''}
        </div>

        <div class="card mb-4">
          <div class="flex items-center justify-between mb-4"><span class="mono-label">Bônus</span></div>
          ${bonusHtml}
          ${podeMexer ? `
            <form id="formNovoBonus" class="flex gap-2 mt-4">
              <input type="text" id="bDescricao" placeholder="Ex: 10 Reels" required style="flex:2;" />
              <input type="number" id="bQtd" placeholder="Qtd (opcional)" style="width:100px;" />
              <button type="submit" class="btn btn-secondary btn-sm">Adicionar bônus</button>
            </form>
          ` : ''}
        </div>

        <div class="card mb-4">
          <div class="mono-label mb-2">Condição de pagamento</div>
          <div class="field">
            <label class="mono-label">Condição</label>
            <select id="cCondicaoTipo" ${podeMexer ? '' : 'disabled'}>
              <option value="">—</option>
              ${CONDICOES_PAGAMENTO.map((o) => `<option value="${o.valor}" ${contrato.condicao_pagamento_tipo === o.valor ? 'selected' : ''}>${o.label}</option>`).join('')}
            </select>
          </div>
          ${podeMexer && !contrato.condicao_pagamento_tipo && sugerirCondicaoPorFaixa(contrato.valor_negociado_total) ? `
          <p class="text-muted" style="font-size:12px; margin:-6px 0 12px;">Sugestão para ${formatarMoeda(contrato.valor_negociado_total)}: <strong>${(CONDICOES_PAGAMENTO.find((o) => o.valor === sugerirCondicaoPorFaixa(contrato.valor_negociado_total)) || {}).label}</strong>
            <button type="button" class="btn-ghost" id="btnAplicarSugestao" style="font-size:12px; text-decoration:underline;">Aplicar</button></p>` : ''}
          <div class="field ${contrato.condicao_pagamento_tipo === 'sinal_saldo' ? '' : 'hidden'}" id="campoPercentualEntrada">
            <label class="mono-label">Percentual de entrada (sinal)</label>
            <select id="cPercentualPreset" ${podeMexer ? '' : 'disabled'}>
              ${PERCENTUAIS_ENTRADA_PRESET.map((p) => `<option value="${p}" ${Number(contrato.condicao_pagamento_percentual_entrada) === p ? 'selected' : ''}>${p}%</option>`).join('')}
              <option value="personalizado" ${contrato.condicao_pagamento_percentual_entrada && !PERCENTUAIS_ENTRADA_PRESET.includes(Number(contrato.condicao_pagamento_percentual_entrada)) ? 'selected' : ''}>Personalizado</option>
            </select>
            <input type="number" id="cPercentualCustom" min="1" max="99" step="1" placeholder="% personalizado" class="mt-2 ${contrato.condicao_pagamento_percentual_entrada && !PERCENTUAIS_ENTRADA_PRESET.includes(Number(contrato.condicao_pagamento_percentual_entrada)) ? '' : 'hidden'}" value="${contrato.condicao_pagamento_percentual_entrada && !PERCENTUAIS_ENTRADA_PRESET.includes(Number(contrato.condicao_pagamento_percentual_entrada)) ? contrato.condicao_pagamento_percentual_entrada : ''}" ${podeMexer ? '' : 'disabled'} />
            <p class="text-muted mt-2" style="font-size:12px;" id="sinalSaldoResumo"></p>
          </div>
          <div class="field ${['parcelado_semanal', 'parcelado_mensal'].includes(contrato.condicao_pagamento_tipo) ? '' : 'hidden'}" id="campoParcelas">
            <label class="mono-label">Parcelas</label>
            <div class="flex gap-2">
              <input type="number" id="cParcelasQtd" min="1" step="1" placeholder="Quantidade" style="flex:1;" value="${contrato.parcelas_quantidade || ''}" ${podeMexer ? '' : 'disabled'} />
              <select id="cParcelasPeriodicidade" style="flex:1;" ${podeMexer ? '' : 'disabled'}>
                ${PERIODICIDADES.map((p) => `<option value="${p.valor}" ${contrato.parcelas_periodicidade === p.valor ? 'selected' : ''}>${p.label}</option>`).join('')}
              </select>
            </div>
            <input type="text" id="cParcelasObs" placeholder="Observação (opcional)" class="mt-2" value="${escapeHtml(contrato.parcelas_observacao || '')}" ${podeMexer ? '' : 'disabled'} />
          </div>
          <div class="field ${contrato.condicao_pagamento_tipo === 'personalizado' ? '' : 'hidden'}" id="campoCondicaoPersonalizada">
            <label class="mono-label">Descreva a condição negociada</label>
            <textarea id="cCondicaoPersonalizada" rows="2" ${podeMexer ? '' : 'disabled'}>${escapeHtml(contrato.condicao_pagamento_tipo === 'personalizado' ? (contrato.condicoes_pagamento_texto || '') : '')}</textarea>
          </div>

          <div class="field mt-4">
            <label class="mono-label">Forma de pagamento</label>
            <select id="cFormaPagamento" ${podeMexer ? '' : 'disabled'}>
              <option value="">—</option>
              ${FORMAS_PAGAMENTO.map((o) => `<option value="${o.valor}" ${contrato.forma_pagamento === o.valor ? 'selected' : ''}>${o.label}</option>`).join('')}
            </select>
          </div>
          <div class="field ${contrato.forma_pagamento === 'outro' ? '' : 'hidden'}" id="campoFormaOutro">
            <input type="text" id="cFormaOutroDescricao" placeholder="Descreva a forma de pagamento" value="${escapeHtml(contrato.forma_pagamento_outro_descricao || '')}" ${podeMexer ? '' : 'disabled'} />
          </div>

          <div class="field mt-4">
            <label class="mono-label">Início da contagem do suporte</label>
            <select id="cSuporteInicio" ${podeMexer ? '' : 'disabled'}>
              <option value="entrega" ${contrato.suporte_inicio !== 'assinatura' ? 'selected' : ''}>A partir da entrega (padrão)</option>
              <option value="assinatura" ${contrato.suporte_inicio === 'assinatura' ? 'selected' : ''}>A partir da assinatura do contrato</option>
            </select>
          </div>
          <div class="field mt-4"><label class="mono-label">Condições especiais</label><textarea id="cCondicoesEspeciais" rows="3" ${podeMexer ? '' : 'disabled'}>${escapeHtml(contrato.condicoes_especiais || '')}</textarea></div>
          <div class="field"><label class="mono-label">Observações internas</label><textarea id="cObservacoes" rows="2" ${podeMexer ? '' : 'disabled'}>${escapeHtml(contrato.observacoes || '')}</textarea></div>

          ${contrato.condicoes_pagamento_texto ? `<p class="text-muted mt-2" style="font-size:12px;">Resumo atual: ${escapeHtml(contrato.condicoes_pagamento_texto)}</p>` : ''}
          ${podeMexer ? `<button class="btn btn-primary btn-sm mt-2" id="btnSalvarCondicoes">Salvar condições</button>` : ''}
        </div>

        <div class="card">
          <div class="mono-label mb-2">Resumo</div>
          <div class="resumo-linha"><span>Preço de tabela</span><span>${formatarMoeda(contrato.valor_tabela_total)}</span></div>
          <div class="resumo-linha"><span>Desconto</span><span>${formatarMoeda(contrato.desconto_total)}</span></div>
          <div class="resumo-linha"><span>Valor negociado</span><span>${formatarMoeda(contrato.valor_negociado_total)}</span></div>
        </div>
      `;
    }

    function ligarEventosComercial() {
      const formItem = document.getElementById('formNovoItem');
      if (formItem) {
        document.getElementById('itProduto').addEventListener('change', (e) => {
          const opt = e.target.selectedOptions[0];
          const preco = opt ? opt.dataset.preco : '';
          if (preco) { document.getElementById('itTabela').value = preco; document.getElementById('itNegociado').value = preco; }
        });
        formItem.addEventListener('submit', async (e) => {
          e.preventDefault();
          const produtoSel = document.getElementById('itProduto');
          const produtoId = produtoSel.value || null;
          const nomeProduto = produtoId ? produtoSel.selectedOptions[0].textContent.split(' — ')[0] : null;
          const descricao = document.getElementById('itDescricao').value.trim() || nomeProduto;
          const quantidade = Number(document.getElementById('itQtd').value) || 1;
          const valorTabela = Number(document.getElementById('itTabela').value.replace(',', '.')) || 0;
          const valorNegociado = Number(document.getElementById('itNegociado').value.replace(',', '.')) || valorTabela;
          const desconto = Number(document.getElementById('itDesconto').value.replace(',', '.')) || 0;
          if (!descricao) { alert('Escolha um produto ou informe uma descrição.'); return; }
          const { error } = await supabase.from('contrato_itens').insert({
            empresa_id: empresaId, contrato_id: contratoId, produto_id: produtoId, descricao,
            quantidade, valor_tabela_unitario: valorTabela, valor_negociado_unitario: valorNegociado, desconto_unitario: desconto,
          });
          if (error) { alert('Não foi possível adicionar o item: ' + error.message); return; }
          await recalcularTotais();
          await carregarCabecalho();
          await abrirAba('comercial');
        });
      }

      document.querySelectorAll('[data-remover-item]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Remover este item?')) return;
          const { error } = await supabase.from('contrato_itens').delete().eq('id', btn.dataset.removerItem);
          if (error) { alert('Não foi possível remover: ' + error.message); return; }
          await recalcularTotais();
          await carregarCabecalho();
          await abrirAba('comercial');
        });
      });

      const formBonus = document.getElementById('formNovoBonus');
      if (formBonus) {
        formBonus.addEventListener('submit', async (e) => {
          e.preventDefault();
          const descricao = document.getElementById('bDescricao').value.trim();
          const qtd = document.getElementById('bQtd').value ? Number(document.getElementById('bQtd').value) : null;
          const { error } = await supabase.from('contrato_bonus').insert({ empresa_id: empresaId, contrato_id: contratoId, descricao, quantidade: qtd });
          if (error) { alert('Não foi possível adicionar o bônus: ' + error.message); return; }
          await abrirAba('comercial');
        });
      }

      document.querySelectorAll('[data-remover-bonus]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Remover este bônus?')) return;
          await supabase.from('contrato_bonus').delete().eq('id', btn.dataset.removerBonus);
          await abrirAba('comercial');
        });
      });

      // ---- Toggles de visibilidade + calculo ao vivo de sinal/saldo ----
      const condicaoTipoSel = document.getElementById('cCondicaoTipo');
      const percentualPreset = document.getElementById('cPercentualPreset');
      const percentualCustom = document.getElementById('cPercentualCustom');
      const formaSel = document.getElementById('cFormaPagamento');
      const btnSugestao = document.getElementById('btnAplicarSugestao');
      if (btnSugestao) btnSugestao.addEventListener('click', () => {
        condicaoTipoSel.value = sugerirCondicaoPorFaixa(contrato.valor_negociado_total);
        condicaoTipoSel.dispatchEvent(new Event('change'));
      });

      function percentualEntradaAtual() {
        if (!percentualPreset) return null;
        if (percentualPreset.value === 'personalizado') {
          const v = Number(percentualCustom.value);
          return v > 0 && v < 100 ? v : null;
        }
        return Number(percentualPreset.value);
      }

      function atualizarResumoSinalSaldo() {
        const box = document.getElementById('sinalSaldoResumo');
        if (!box) return;
        const pct = percentualEntradaAtual();
        if (!pct) { box.textContent = ''; return; }
        const saldo = 100 - pct;
        const valorNegociado = Number(contrato.valor_negociado_total) || 0;
        const valorSinal = valorNegociado * (pct / 100);
        const valorSaldo = valorNegociado - valorSinal;
        box.textContent = `Sinal: ${pct}% — ${formatarMoeda(valorSinal)}   |   Saldo: ${saldo}% — ${formatarMoeda(valorSaldo)}`;
      }

      function atualizarVisibilidadeCondicao() {
        const tipo = condicaoTipoSel.value;
        document.getElementById('campoPercentualEntrada').classList.toggle('hidden', tipo !== 'sinal_saldo');
        document.getElementById('campoParcelas').classList.toggle('hidden', !['parcelado_semanal', 'parcelado_mensal'].includes(tipo));
        document.getElementById('campoCondicaoPersonalizada').classList.toggle('hidden', tipo !== 'personalizado');
        if (tipo === 'sinal_saldo') atualizarResumoSinalSaldo();
      }

      if (condicaoTipoSel) {
        condicaoTipoSel.addEventListener('change', atualizarVisibilidadeCondicao);
        atualizarVisibilidadeCondicao();
      }
      if (percentualPreset) {
        percentualPreset.addEventListener('change', () => {
          percentualCustom.classList.toggle('hidden', percentualPreset.value !== 'personalizado');
          atualizarResumoSinalSaldo();
        });
        percentualCustom.addEventListener('input', atualizarResumoSinalSaldo);
      }
      if (formaSel) {
        formaSel.addEventListener('change', () => {
          document.getElementById('campoFormaOutro').classList.toggle('hidden', formaSel.value !== 'outro');
        });
      }

      const btnSalvarCondicoes = document.getElementById('btnSalvarCondicoes');
      if (btnSalvarCondicoes) {
        btnSalvarCondicoes.addEventListener('click', async () => {
          btnSalvarCondicoes.disabled = true; btnSalvarCondicoes.textContent = 'Salvando...';

          const condicaoTipo = condicaoTipoSel.value || null;
          const percentualEntrada = condicaoTipo === 'sinal_saldo' ? percentualEntradaAtual() : null;
          const formaPagamento = formaSel.value || null;
          const formaOutro = formaPagamento === 'outro' ? document.getElementById('cFormaOutroDescricao').value.trim() || null : null;
          const parcelasQtd = ['parcelado_semanal', 'parcelado_mensal'].includes(condicaoTipo) ? (Number(document.getElementById('cParcelasQtd').value) || null) : null;
          const parcelasPeriodicidade = ['parcelado_semanal', 'parcelado_mensal'].includes(condicaoTipo) ? document.getElementById('cParcelasPeriodicidade').value : null;
          const parcelasObs = ['parcelado_semanal', 'parcelado_mensal'].includes(condicaoTipo) ? (document.getElementById('cParcelasObs').value.trim() || null) : null;
          const textoPersonalizado = condicaoTipo === 'personalizado' ? document.getElementById('cCondicaoPersonalizada').value.trim() || null : null;

          const resumo = montarResumoCondicaoPagamento({
            condicaoTipo, percentualEntrada, formaPagamento, formaPagamentoOutro: formaOutro,
            parcelasQuantidade: parcelasQtd, parcelasPeriodicidade, parcelasObservacao: parcelasObs, textoPersonalizado,
          });

          const { error } = await supabase.from('contratos').update({
            condicao_pagamento_tipo: condicaoTipo,
            condicao_pagamento_percentual_entrada: percentualEntrada,
            forma_pagamento: formaPagamento,
            forma_pagamento_outro_descricao: formaOutro,
            parcelas_quantidade: parcelasQtd,
            parcelas_periodicidade: parcelasPeriodicidade,
            parcelas_observacao: parcelasObs,
            condicoes_pagamento_texto: resumo,
            suporte_inicio: document.getElementById('cSuporteInicio').value,
            condicoes_especiais: document.getElementById('cCondicoesEspeciais').value.trim() || null,
            observacoes: document.getElementById('cObservacoes').value.trim() || null,
          }).eq('id', contratoId);
          btnSalvarCondicoes.disabled = false; btnSalvarCondicoes.textContent = 'Salvar condições';
          if (error) { alert('Não foi possível salvar: ' + error.message); return; }
          await carregarCabecalho();
          await abrirAba('comercial');
        });
      }
    }

    // ==================== ABA DOCUMENTO ====================

      const podeExcluirVersao = podeAdministrar;

          <p class="text-muted mt-2" style="font-size:12px;">O PDF é gerado com as cláusulas do contrato-base, o quadro comercial atual, a assinatura da contratada (depois de registrada no link) e — depois que o cliente confirmar — os dados e assinatura dele, e salvo como uma nova versão no histórico.</p>
          ${podeGerar ? `

            <div class="mt-2">
              ${contrato.contratada_assinada_em

                : `<p class="text-muted" style="font-size:12px; line-height:1.5; margin-bottom:8px;">A assinatura fica registrada no contrato quando você gera o link público. Fica salva para os próximos contratos. Em um contrato que já tem link, você pode registrá-la agora: <button class="btn-ghost" id="btnRegistrarAssinaturaContratada" type="button" style="font-size:12px; text-decoration:underline;">Registrar minha assinatura neste contrato</button></p>`}
              <div class="flex items-center justify-between mb-2">
                <span class="text-muted" style="font-size:11.5px;">Usa os últimos dados salvos. Clique em Editar para alterar (ex.: novo CNPJ ou assinatura).</span>
                <button class="btn btn-secondary btn-sm" id="ctEditar" type="button">Editar</button>
              </div>
              <div class="field"><label class="mono-label">Nome / razão social</label><input type="text" id="ctNome" disabled placeholder="Ex.: Edvan Silva / Criativamente" /></div>
              <div class="field"><label class="mono-label">CPF/CNPJ</label><input type="text" id="ctDoc" disabled /></div>
              <div class="field"><label class="mono-label">Endereço</label><input type="text" id="ctEndereco" disabled /></div>
              <div class="field"><label class="mono-label">Responsável legal</label><input type="text" id="ctResp" disabled /></div>
              <div class="flex gap-2">
                <div class="field" style="flex:1;"><label class="mono-label">CPF do responsável</label><input type="text" id="ctRespCpf" disabled /></div>
                <div class="field" style="flex:1;"><label class="mono-label">Cargo</label><input type="text" id="ctRespCargo" disabled /></div>

              <div class="mono-label mt-2">Assinatura da contratada</div>
              <div class="flex gap-2 mb-2 mt-2">
                <input type="text" id="ctTexto" disabled placeholder="Digite o nome para assinar em letra cursiva (ou desenhe abaixo)" style="flex:2;" />
                <select id="ctFonte" disabled style="flex:1;">${FONTES_ASSINATURA.map((f) => `<option value="${f.valor}">${f.label}</option>`).join('')}</select>
              </div>
              <canvas id="ctCanvas" style="width:100%; height:140px; background:#fff; border:1px solid var(--line-strong); border-radius:var(--radius); touch-action:none; cursor:not-allowed;"></canvas>

              <p class="text-muted mt-2" id="ctStatus" style="font-size:11.5px;"></p>

        <div class="card mb-4">
          <div class="mono-label mb-2">Versão atual</div>
          ${atual
            ? `<div class="flex items-center justify-between"><span style="font-size:16px; font-weight:800;">V${atual.versao} — ${escapeHtml((atual.documentos && atual.documentos.categoria_documento) || '—')}</span><button class="btn-ghost" data-baixar="${atual.documentos ? atual.documentos.storage_path : ''}" style="font-size:12px; text-decoration:underline;">Abrir</button></div><p class="text-muted mt-1" style="font-size:12px;">${formatarData(atual.created_at, true)}</p>`
            : `<p class="text-muted">Nenhum documento gerado ainda.</p>`}
        </div>
        ${podeAdministrar && lixeiraVersoes.length > 0 ? `
        <div class="card mb-4">
          <div class="mono-label mb-4">Documentos ocultos</div>
          <div class="table-wrap"><table class="data-table"><thead><tr><th>Versão</th><th>Arquivo</th><th>Movido em</th><th></th></tr></thead><tbody>
            ${lixeiraVersoes.map((v) => `<tr>
              <td>v${v.versao}</td>
              <td class="cell-primary">${escapeHtml((v.documentos && v.documentos.nome_arquivo) || '—')}</td>
              <td class="cell-muted">${formatarData(v.excluido_em, true)}</td>
              <td><button class="btn-ghost" data-restaurar-versao="${v.id}" style="font-size:12px; text-decoration:underline;">Mostrar de novo</button>
                  <button class="btn-ghost" data-excluir-versao-def="${v.id}" data-versao-num="${v.versao}" style="font-size:12px; text-decoration:underline; color:var(--status-erro);">Excluir definitivamente</button></td>
            </tr>`).join('')}
          </tbody></table></div>
        </div>` : ''}
        <div class="card">
          <div class="flex items-center justify-between mb-4"><span class="mono-label">Histórico de versões</span>${lista.length > 1 ? `<button class="btn-ghost" id="btnToggleHistorico" style="font-size:12px; text-decoration:underline;">Ver histórico (${lista.length})</button>` : ''}</div>
          <div id="historicoVersoes" class="${lista.length > 1 ? 'hidden' : ''}">${versoesHtml}</div>
        </div>
      `;

    function ligarEventosDocumento() {
      const btnToggleHistorico = document.getElementById('btnToggleHistorico');
      if (btnToggleHistorico) {
        btnToggleHistorico.addEventListener('click', () => {
          const box = document.getElementById('historicoVersoes');
          box.classList.toggle('hidden');
          btnToggleHistorico.textContent = box.classList.contains('hidden') ? `Ver histórico` : 'Ocultar histórico';
        });
      }
      const btn = document.getElementById('btnGerarPdf');
      let ctTemTraco = false;
      if (btn && document.getElementById('detalhesContratada')) {
        const ctIds = ['ctNome', 'ctDoc', 'ctEndereco', 'ctResp', 'ctRespCpf', 'ctRespCargo'];
        const canvasCt = document.getElementById('ctCanvas');
        const c2d = canvasCt.getContext('2d');
        let desenhandoCt = false;
        let ctEditando = false;
        const prepararCanvasCt = () => {
          const r = canvasCt.getBoundingClientRect();
          if (r.width > 0) { canvasCt.width = r.width; canvasCt.height = r.height; }
          c2d.lineWidth = 2.4; c2d.lineCap = 'round'; c2d.lineJoin = 'round'; c2d.strokeStyle = '#12141a';
        };
        garantirFontesAssinatura();
        (async () => {
          const [{ data: cfg }, { data: emp }] = await Promise.all([
            supabase.from('configuracoes').select('valor').eq('empresa_id', empresaId).eq('chave', 'dados_fiscais_contratada').maybeSingle(),
            supabase.from('empresas').select('nome').eq('id', empresaId).maybeSingle(),
          ]);
          const f = cfg?.valor || {};
          document.getElementById('ctNome').value = f.razao_social || emp?.nome || '';
          document.getElementById('ctDoc').value = f.cnpj_cpf || '';
          document.getElementById('ctEndereco').value = f.endereco || '';
          document.getElementById('ctResp').value = f.responsavel_legal || '';
          document.getElementById('ctRespCpf').value = f.responsavel_cpf || '';
          document.getElementById('ctRespCargo').value = f.responsavel_cargo || '';
          document.getElementById('ctTexto').value = f.assinatura_texto || '';
          if (f.assinatura_fonte) document.getElementById('ctFonte').value = f.assinatura_fonte;
          document.getElementById('detalhesContratada').addEventListener('toggle', () => {
            prepararCanvasCt();
            if (f.assinatura_png) {
              const img = new Image();
              img.onload = () => { c2d.drawImage(img, 0, 0, canvasCt.width, canvasCt.height); ctTemTraco = true; };
              img.src = f.assinatura_png;
              document.getElementById('ctStatus').textContent = 'Assinatura salva.';
            } else {
              document.getElementById('ctStatus').textContent = 'Nenhuma assinatura cadastrada ainda. Clique em Editar para criar.';
            }
          }, { once: true });
        })();

        const btnReg = document.getElementById('btnRegistrarAssinaturaContratada');
        if (btnReg) btnReg.addEventListener('click', async () => {
          if (!confirm('Registrar sua assinatura (com data e hora de agora) neste contrato? Depois de registrada, ela não muda neste contrato.')) return;
          try { await assinarContratadaContrato(contratoId); await carregarCabecalho(); await abrirAba('documento'); }
          catch (err) { alert(err.message); }
        });
        const alternarEdicao = (editando) => {
          ctEditando = editando;
          ctIds.forEach((id) => { document.getElementById(id).disabled = !editando; });
          document.getElementById('ctTexto').disabled = !editando;
          document.getElementById('ctFonte').disabled = !editando;
          document.getElementById('ctLimpar').disabled = !editando;
          canvasCt.style.cursor = editando ? 'crosshair' : 'not-allowed';
          document.getElementById('ctEditar').textContent = editando ? 'Concluir edição' : 'Editar';
        };
        document.getElementById('ctEditar').addEventListener('click', async () => {
          if (!ctEditando) { alternarEdicao(true); return; }
          const val = (id) => document.getElementById(id).value.trim() || null;
          const assinaturaPng = ctTemTraco ? canvasCt.toDataURL('image/png') : null;
          const valor = {
            razao_social: val('ctNome'), cnpj_cpf: val('ctDoc'), endereco: val('ctEndereco'),
            responsavel_legal: val('ctResp'), responsavel_cpf: val('ctRespCpf'), responsavel_cargo: val('ctRespCargo'),
            assinatura_png: assinaturaPng, assinatura_texto: val('ctTexto'), assinatura_fonte: document.getElementById('ctFonte').value,
          };
          const { data: existente } = await supabase.from('configuracoes').select('id').eq('empresa_id', empresaId).eq('chave', 'dados_fiscais_contratada').maybeSingle();
          const { error } = existente
            ? await supabase.from('configuracoes').update({ valor }).eq('id', existente.id)
            : await supabase.from('configuracoes').insert({ empresa_id: empresaId, chave: 'dados_fiscais_contratada', valor });
          if (error) { alert('Não foi possível salvar: ' + error.message); return; }
          alternarEdicao(false);
          document.getElementById('ctStatus').textContent = assinaturaPng ? 'Dados e assinatura salvos para os próximos contratos.' : 'Dados salvos (sem assinatura).';
        });

        const posCt = (ev) => { const r = canvasCt.getBoundingClientRect(); const p = ev.touches ? ev.touches[0] : ev; return { x: p.clientX - r.left, y: p.clientY - r.top }; };
        const iniCt = (ev) => { if (!ctEditando) return; ev.preventDefault(); desenhandoCt = true; const p = posCt(ev); c2d.beginPath(); c2d.moveTo(p.x, p.y); };
        const movCt = (ev) => { if (!desenhandoCt) return; ev.preventDefault(); const p = posCt(ev); c2d.lineTo(p.x, p.y); c2d.stroke(); ctTemTraco = true; };
        canvasCt.addEventListener('mousedown', iniCt); canvasCt.addEventListener('mousemove', movCt);
        window.addEventListener('mouseup', () => { desenhandoCt = false; });
        canvasCt.addEventListener('touchstart', iniCt, { passive: false }); canvasCt.addEventListener('touchmove', movCt, { passive: false });
        canvasCt.addEventListener('touchend', () => { desenhandoCt = false; });
        document.getElementById('ctLimpar').addEventListener('click', () => { c2d.clearRect(0, 0, canvasCt.width, canvasCt.height); document.getElementById('ctTexto').value = ''; ctTemTraco = false; });
        const atualizarTextoCt = async () => {
          prepararCanvasCt();
          ctTemTraco = await desenharTextoNoCanvas(canvasCt, document.getElementById('ctTexto').value, document.getElementById('ctFonte').value);
        };
        document.getElementById('ctTexto').addEventListener('input', atualizarTextoCt);
        document.getElementById('ctFonte').addEventListener('change', atualizarTextoCt);
      }
      if (btn) {
        btn.addEventListener('click', async () => {
          btn.disabled = true; btn.textContent = 'Gerando...';
          try {
            const [{ data: itens }, { data: bonusLista }, { data: snapshotCliente }, { data: empresaRow }, { data: dadosFiscaisRow }] = await Promise.all([
              supabase.from('contrato_itens').select('*').eq('contrato_id', contratoId).order('created_at'),
              supabase.from('contrato_bonus').select('*').eq('contrato_id', contratoId).order('created_at'),
              // Snapshot OFICIAL confirmado pelo cliente -- nunca o cadastro
              // vivo de crm.contatos pra reconstruir um contrato ja em
              // andamento/confirmado. So cai no cadastro vivo se o cliente
              // ainda nem preencheu nada (documento inicial, pre-confirmacao).
              supabase.from('contrato_dados_cliente').select('*').eq('contrato_id', contratoId).not('confirmado_em', 'is', null).order('confirmado_em', { ascending: false }).limit(1).maybeSingle(),
              supabase.from('empresas').select('nome').eq('id', empresaId).maybeSingle(),
              // Dados fiscais da contratada (razao social/CNPJ) -- configuraveis
              // em Configurações, nunca hardcoded no template do PDF.
              supabase.from('configuracoes').select('valor').eq('empresa_id', empresaId).eq('chave', 'dados_fiscais_contratada').maybeSingle(),
            ]);

            const clienteSnapshot = snapshotCliente || {
              nome_completo: contato.nome, cpf_cnpj: contato.cpf_cnpj, telefone: contato.whatsapp, email: contato.email,
              empresa_marca: contato.empresa_marca || null,
            };
            let dadosFiscais = dadosFiscaisRow?.valor || {};
            let contratadaAssinatura = null;
            let contratadaAssinadaEm = null;
            // Dados e assinatura da contratada REGISTRADOS no contrato (ao gerar o link) prevalecem.
            // Antes do link, o PDF sai sem a assinatura da contratada (ela so assina ao gerar o link).
            if (contrato.contratada_snapshot) {
              const sn = contrato.contratada_snapshot;
              dadosFiscais = { razao_social: sn.nome, cnpj_cpf: sn.documento, endereco: sn.endereco, responsavel_legal: sn.responsavel, responsavel_cpf: sn.responsavelCpf, responsavel_cargo: sn.responsavelCargo };
              if (contrato.contratada_assinatura_path) {
                const { data: arqCt } = await supabase.storage.from('documentos-internos').download(contrato.contratada_assinatura_path);
                if (arqCt) {
                  contratadaAssinatura = await new Promise((resolve) => { const rd = new FileReader(); rd.onloadend = () => resolve(rd.result); rd.readAsDataURL(arqCt); });
                  contratadaAssinadaEm = contrato.contratada_assinada_em;
                }
              }
            }

            let assinatura = null;
            if (snapshotCliente?.assinatura_storage_path) {
              const { data: arquivoAssinatura } = await supabase.storage.from('documentos-internos').download(snapshotCliente.assinatura_storage_path);
              if (arquivoAssinatura) {
                const dataUrl = await new Promise((resolve) => {
                  const reader = new FileReader();
                  reader.onloadend = () => resolve(reader.result);
                  reader.readAsDataURL(arquivoAssinatura);
                });
                assinatura = { dataUrl, confirmadoEm: snapshotCliente.assinatura_confirmada_em };
              }
            }

            const { data: ultimaVersaoAtual } = await supabase.from('contratos_versoes').select('versao').eq('contrato_id', contratoId).order('versao', { ascending: false }).limit(1).maybeSingle();
            const proximaVersao = (ultimaVersaoAtual?.versao || 0) + 1;

            const blob = gerarPdfContrato({
              contrato, itens: itens || [], bonus: bonusLista || [],
              empresaNome: dadosFiscais.razao_social || empresaRow?.nome || 'Criativamente',
              contratadaDocumento: dadosFiscais.cnpj_cpf || null,
              contratadaEndereco: dadosFiscais.endereco || null,
              contratadaResponsavel: dadosFiscais.responsavel_legal || null,
              contratadaResponsavelCpf: dadosFiscais.responsavel_cpf || null,
              contratadaResponsavelCargo: dadosFiscais.responsavel_cargo || null,
              contratadaAssinaturaDataUrl: contratadaAssinatura,
              contratadaAssinadaEm,
              logoDataUrl: await carregarLogoDataUrl(),
              clienteSnapshot, versao: proximaVersao, assinatura,
            });
            await salvarDocumentoContrato({
              empresaId, contratoId, blob, categoria: assinatura ? 'assinado' : 'original',
              nomeArquivo: `contrato-${contratoId.slice(0, 8)}-v${proximaVersao}.pdf`, usuarioId,
              motivoSubstituicao: snapshotCliente ? 'Documento atualizado com os dados confirmados pelo cliente' : 'Documento gerado a partir das condições comerciais atuais',
            });
            await supabase.from('atividades').insert({ empresa_id: empresaId, contrato_id: contratoId, tipo: 'versao_criada', titulo: 'Documento do contrato gerado', usuario_id: usuarioId });
            alert('Documento gerado e salvo com sucesso.');
            await abrirAba('documento');
          } catch (err) {
            alert('Falha ao gerar o documento: ' + err.message);
          } finally {
            btn.disabled = false; btn.textContent = 'Gerar documento do contrato (PDF)';
          }
        });
      }

      const msgVersao = { cliente_ja_assinou: 'O cliente já assinou — esta versão não pode mais ser excluída.', contrato_nao_permite_exclusao: 'O status atual do contrato não permite excluir versões.', sem_permissao: 'Somente administradores podem fazer isso.', documento_assinado_nao_excluivel: 'Documentos assinados anexados não podem ser excluídos.', nao_esta_na_lixeira: 'Esta versão não está na lixeira.' };
      const falhaVersao = (error) => { const k = Object.keys(msgVersao).find((x) => (error.message || '').includes(x)); alert(k ? msgVersao[k] : 'Não foi possível concluir: ' + error.message); };
      document.querySelectorAll('[data-excluir-versao]').forEach((el) => {
        el.addEventListener('click', async () => {
          if (!confirm(`Ocultar a versão v${el.dataset.versaoNum} da lista? O histórico é preservado e você pode mostrá-la de novo depois.`)) return;
          const { error } = await supabase.rpc('excluir_versao_contrato', { p_versao_id: el.dataset.excluirVersao });
          if (error) { falhaVersao(error); return; }
          await abrirAba('documento');
        });
      });
      document.querySelectorAll('[data-restaurar-versao]').forEach((el) => {
        el.addEventListener('click', async () => {
          const { error } = await supabase.rpc('restaurar_versao_contrato', { p_versao_id: el.dataset.restaurarVersao });
          if (error) { falhaVersao(error); return; }
          await abrirAba('documento');
        });
      });
      document.querySelectorAll('[data-excluir-versao-def]').forEach((el) => {
        el.addEventListener('click', async () => {
          if (!confirm(`Excluir a versão v${el.dataset.versaoNum} DEFINITIVAMENTE? Não dá para desfazer.`)) return;
          const { data: caminho, error } = await supabase.rpc('excluir_definitivamente_versao_contrato', { p_versao_id: el.dataset.excluirVersaoDef });
          if (error) { falhaVersao(error); return; }
          if (caminho) await supabase.storage.from('documentos-internos').remove([caminho]);
          await abrirAba('documento');
        });
      });

      document.querySelectorAll('[data-baixar]').forEach((el) => {
        el.addEventListener('click', async () => {
          const path = el.dataset.baixar;
          if (!path) return;
          const { data, error } = await supabase.storage.from('documentos-internos').createSignedUrl(path, 300);
          if (error || !data) { alert('Não foi possível abrir o documento.'); return; }
          window.open(data.signedUrl, '_blank');
        });
      });
    }

    // ==================== ABA LINK ====================
    async function abaLink() {
      const { data: todosLinks } = await supabase.from('contrato_links').select('*').eq('contrato_id', contratoId).order('created_at', { ascending: false });
      const links = (todosLinks || []).filter((l) => !l.excluido_em);
      const linksLixeira = (todosLinks || []).filter((l) => l.excluido_em);
      const podeGerenciar = podeEditar;

      const LINK_STATUS_BADGE = { ativo: 'dot-info', dados_confirmados: 'dot-info', confirmado: 'dot-sucesso', expirado: 'dot-neutro', revogado: 'dot-erro' };
      const LINK_STATUS_LABEL = { ativo: 'Aguardando cliente', dados_confirmados: 'Dados confirmados, aguardando assinatura', confirmado: 'Assinado', expirado: 'Expirado', revogado: 'Revogado' };

      const linksHtml = (links || []).length === 0
        ? `<div class="empty-state"><p>Nenhum link gerado ainda.</p></div>`
        : `<div class="table-wrap"><table class="data-table"><thead><tr><th>Status</th><th>Criado em</th><th>Expira em</th><th>Acessos</th><th></th></tr></thead><tbody>
            ${links.map((l) => `
              <tr>
                <td><span class="badge ${LINK_STATUS_BADGE[l.status] || 'dot-neutro'}"><span class="dot"></span>${LINK_STATUS_LABEL[l.status] || l.status}</span></td>
                <td class="cell-muted">${formatarData(l.created_at, true)}</td>
                <td class="cell-muted">${formatarData(l.expires_at, true)}</td>
                <td>${l.access_count}</td>
                <td style="white-space:nowrap;">
                  ${podeGerenciar && (l.status === 'ativo' || l.status === 'dados_confirmados') && l.token_cifrado ? `<button class="btn-ghost" data-abrir-link="${l.id}" style="font-size:12px; text-decoration:underline;">Abrir</button> <button class="btn-ghost" data-copiar-link="${l.id}" style="font-size:12px; text-decoration:underline;">Copiar</button> <button class="btn-ghost" data-email-link="${l.id}" style="font-size:12px; text-decoration:underline;">E-mail</button>` : ''}
                  ${podeGerenciar && (l.status === 'ativo' || l.status === 'dados_confirmados') && !l.token_cifrado ? `<span class="text-muted" style="font-size:11px;" title="Criado antes do recurso de reabrir. Gere um novo link.">sem acesso ao link</span>` : ''}
                  ${podeGerenciar && (l.status === 'ativo' || l.status === 'dados_confirmados') ? `<button class="btn-ghost" data-revogar="${l.id}" style="font-size:12px; text-decoration:underline; color:var(--status-erro);">Revogar</button>` : ''}
                  ${podeAdministrar && (l.status === 'revogado' || l.status === 'expirado' || l.status === 'confirmado') ? `<button class="btn-ghost" data-lixeira-link="${l.id}" style="font-size:12px; text-decoration:underline;">Ocultar</button>` : ''}
                </td>
              </tr>
            `).join('')}
          </tbody></table></div>`;

      return `
        <div class="card mb-4">
          ${podeGerenciar ? `<button class="btn btn-primary" id="btnGerarLink">Gerar novo link de preenchimento</button>` : ''}
          <div id="linkGeradoBox"></div>
        </div>
        <div class="card">
          <div class="flex items-center justify-between mb-4"><span class="mono-label">Links já gerados</span><button class="btn-ghost" id="btnAtualizarLista" style="font-size:12px; text-decoration:underline;">Atualizar lista</button></div>
          ${linksHtml}
        </div>
        ${podeAdministrar && linksLixeira.length > 0 ? `
        <div class="card mt-4">
          <div class="mono-label mb-4">Links ocultos</div>
          <div class="table-wrap"><table class="data-table"><thead><tr><th>Status</th><th>Criado em</th><th></th></tr></thead><tbody>
            ${linksLixeira.map((l) => `<tr>
              <td><span class="badge dot-neutro"><span class="dot"></span>${LINK_STATUS_LABEL[l.status] || l.status}</span></td>
              <td class="cell-muted">${formatarData(l.created_at, true)}</td>
              <td><button class="btn-ghost" data-restaurar-link="${l.id}" style="font-size:12px; text-decoration:underline;">Mostrar de novo</button>
                  <button class="btn-ghost" data-excluir-link-def="${l.id}" style="font-size:12px; text-decoration:underline; color:var(--status-erro);">Excluir definitivamente</button></td>
            </tr>`).join('')}
          </tbody></table></div>
        </div>` : ''}
      `;
    }

    async function enviarLinkPorEmail(url, botao) {
      if (!contato.email) { alert('Este cliente não tem e-mail cadastrado.'); return; }
      const primeiroNome = (contato.nome || '').split(' ')[0] || contato.nome || '';
      if (!confirm(`Enviar o link do contrato por e-mail para ${contato.email}?`)) return;
      const rotulo = botao.textContent; botao.disabled = true; botao.textContent = 'Enviando...';
      try {
        await chamarFunction('email-enviar', {
          acao: 'cta', para: [contato.email], assunto: 'Seu contrato — Criativamente', contato_id: contato.id,
          mensagem: `Olá, ${primeiroNome}!\n\nConforme conversamos, segue o link para você revisar seus dados e as condições do contrato. Leva poucos minutos.`,
          cta_label: 'Abrir meu contrato', cta_url: url,
        });
        botao.textContent = 'E-mail enviado';
        await supabase.from('atividades').insert({ empresa_id: empresaId, contrato_id: contratoId, tipo: 'contrato_enviado', titulo: 'Link do contrato enviado por e-mail', usuario_id: usuarioId, metadata: { canal: 'email', destinatario: contato.email } });
        if (contrato.status === 'rascunho') { await supabase.from('contratos').update({ status: 'enviado' }).eq('id', contratoId); await carregarCabecalho(); }
      } catch (err) {
        botao.disabled = false; botao.textContent = rotulo;
        alert(err.body && err.body.motivo === 'email_nao_configurado' ? 'O envio de e-mail ainda não foi configurado.' : 'Não foi possível enviar o e-mail: ' + err.message);
      }
    }

    function ligarEventosLink() {
      const btn = document.getElementById('btnGerarLink');
      if (btn) {
        btn.addEventListener('click', async () => {
          btn.disabled = true; btn.textContent = 'Gerando...';
          try {
            let resultado;
            try {
              resultado = await gerarLinkContrato(contratoId, 7, false);
            } catch (e1) {
              const m = e1.body && e1.body.motivo;
              const aviso = m === 'revoga_anterior'
                ? 'Já existe um link em andamento. Gerar um novo link REVOGA o anterior: o cliente não conseguirá mais usar o link antigo. Continuar?'
                : (m === 'contrato_ja_assinado' || m === 'pagamento_ativo')
                  ? 'ATENÇÃO: este contrato já foi assinado (ou tem pagamento ativo). Gerar um novo link cria um novo processo e pode afetar o contrato e a prestação de serviço. Só faça isso se tiver certeza. Continuar?'
                  : null;
              if (!aviso) throw e1;
              if (!confirm(aviso)) { btn.disabled = false; btn.textContent = 'Gerar novo link de preenchimento'; return; }
              resultado = await gerarLinkContrato(contratoId, 7, true);
            }
            const url = `${window.location.origin}/contrato-publico.html#t=${resultado.token}`;
            const temWhatsapp = contato.whatsapp && contato.whatsapp.replace(/\D/g, '').length >= 10;
            document.getElementById('linkGeradoBox').innerHTML = `
              <p class="mt-4 text-muted" style="font-size:12.5px;">Copie o link abaixo agora — ele não será mostrado de novo. Expira em ${formatarData(resultado.expires_at, true)}.</p>
              <div class="link-token-box">${escapeHtml(url)}</div>
              <div class="flex gap-2 mt-2">
                <button class="btn btn-secondary btn-sm" id="btnCopiarLink">Copiar link</button>
                <button class="btn btn-secondary btn-sm" id="btnEnviarEmail">Enviar por e-mail</button>
                ${temWhatsapp
                  ? `<button class="btn btn-secondary btn-sm" id="btnEnviarWhatsapp">Enviar pelo WhatsApp</button>`
                  : `<span class="text-muted" style="font-size:12px; align-self:center;">Cliente sem WhatsApp cadastrado</span>`}
              </div>
            `;
            document.getElementById('btnCopiarLink').addEventListener('click', () => {
              navigator.clipboard.writeText(url);
              document.getElementById('btnCopiarLink').textContent = 'Copiado!';
            });
            document.getElementById('btnEnviarEmail').addEventListener('click', (ev) => enviarLinkPorEmail(url, ev.target));
            const btnWhats = document.getElementById('btnEnviarWhatsapp');
            if (btnWhats) {
              btnWhats.addEventListener('click', async () => {
                const primeiroNome = (contato.nome || '').split(' ')[0] || contato.nome || '';
                const mensagem = `Olá, ${primeiroNome}!\n\nConforme conversamos, segue o link para você revisar seus dados e as condições do contrato:\n\n${url}`;
                const link = whatsappLink(contato.whatsapp);
                window.open(`${link}?text=${encodeURIComponent(mensagem)}`, '_blank');
                // Registra a atividade só porque o usuário de fato clicou e o
                // WhatsApp foi aberto com a mensagem pronta -- não temos como
                // confirmar que a mensagem foi enviada de verdade, então o
                // texto do evento reflete exatamente isso (abertura, não envio).
                await supabase.from('atividades').insert({
                  empresa_id: empresaId, contrato_id: contratoId, tipo: 'contrato_enviado',
                  titulo: 'Link aberto no WhatsApp para envio', usuario_id: usuarioId,
                  metadata: { canal: 'whatsapp', destinatario: contato.whatsapp },
                });
                if (contrato.status === 'rascunho') await supabase.from('contratos').update({ status: 'enviado' }).eq('id', contratoId);
                await carregarCabecalho();
              });
            }
            // Nao recarrega a aba/cabecalho aqui de proposito -- o token
            // acima e de uso unico (nunca mais aparece), entao a caixa
            // precisa continuar visivel ate o usuario copiar/enviar. Um
            // "Atualizar" abaixo deixa explicito que ha uma acao pra ver
            // o link na lista, em vez de sumir sozinho.
            btn.textContent = 'Link gerado — clique em "Atualizar lista" para ver na tabela abaixo';
          } catch (err) {
            alert('Falha ao gerar o link: ' + err.message);
            btn.disabled = false; btn.textContent = 'Gerar novo link de preenchimento';
          }
        });
      }

      const urlDoToken = (token) => `${window.location.origin}/contrato-publico.html#t=${token}`;
      document.querySelectorAll('[data-abrir-link]').forEach((el) => {
        el.addEventListener('click', async () => {
          try { const r = await abrirLinkContrato(el.dataset.abrirLink); window.open(urlDoToken(r.token), '_blank'); }
          catch (err) { alert('Não foi possível abrir: ' + err.message); }
        });
      });
      document.querySelectorAll('[data-copiar-link]').forEach((el) => {
        el.addEventListener('click', async () => {
          try { const r = await abrirLinkContrato(el.dataset.copiarLink); await navigator.clipboard.writeText(urlDoToken(r.token)); el.textContent = 'Copiado!'; }
          catch (err) { alert('Não foi possível copiar: ' + err.message); }
        });
      });
      document.querySelectorAll('[data-email-link]').forEach((el) => {
        el.addEventListener('click', async () => {
          try { const r = await abrirLinkContrato(el.dataset.emailLink); await enviarLinkPorEmail(urlDoToken(r.token), el); }
          catch (err) { alert('Não foi possível enviar: ' + err.message); }
        });
      });
      const msgLink = { sem_permissao: 'Somente administradores podem fazer isso.', revogue_antes: 'Revogue o link antes de enviá-lo para a lixeira.', link_com_dados_do_cliente: 'Este link tem dados do cliente e é mantido no histórico; ele permanece oculto.' };
      const rpcLink = async (nome, id, confirma) => {
        if (confirma && !confirm(confirma)) return;
        const { error } = await supabase.rpc(nome, { p_link_id: id });
        if (error) { const k = Object.keys(msgLink).find((x) => (error.message || '').includes(x)); alert(k ? msgLink[k] : 'Falha: ' + error.message); return; }
        await abrirAba('link');
      };
      document.querySelectorAll('[data-lixeira-link]').forEach((el) => el.addEventListener('click', () => rpcLink('excluir_link_contrato', el.dataset.lixeiraLink, 'Ocultar este link da lista? O histórico é preservado e você pode mostrá-lo de novo depois.')));
      document.querySelectorAll('[data-restaurar-link]').forEach((el) => el.addEventListener('click', () => rpcLink('restaurar_link_contrato', el.dataset.restaurarLink)));
      document.querySelectorAll('[data-excluir-link-def]').forEach((el) => el.addEventListener('click', () => rpcLink('excluir_definitivamente_link_contrato', el.dataset.excluirLinkDef, 'Excluir este link DEFINITIVAMENTE? Não dá para desfazer.')));

      document.querySelectorAll('[data-revogar]').forEach((el) => {
        el.addEventListener('click', async () => {
          const motivo = prompt('Motivo da revogação (opcional):') || undefined;
          if (!confirm('Revogar este link? Ele deixará de funcionar imediatamente.')) return;
          try {
            await revogarLinkContrato(el.dataset.revogar, motivo);
            await carregarCabecalho();
            await abrirAba('link');
          } catch (err) {
            alert('Falha ao revogar: ' + err.message);
          }
        });
      });

      const btnAtualizar = document.getElementById('btnAtualizarLista');
      if (btnAtualizar) btnAtualizar.addEventListener('click', async () => { await carregarCabecalho(); await abrirAba('link'); });
    }

    // ==================== ABA ASSINATURA ====================
    async function abaAssinatura() {
      const podeRegistrar = podeEditar && ['aguardando_assinatura', 'assinado'].includes(contrato.status);
      const podeValidar = podeAdministrar && contrato.status === 'assinado';

      const { data: assinaturaCliente } = await supabase
        .from('contrato_dados_cliente')
        .select('assinatura_confirmada_em, nome_completo')
        .eq('contrato_id', contratoId)
        .not('assinatura_confirmada_em', 'is', null)
        .order('assinatura_confirmada_em', { ascending: false })
        .limit(1)
        .maybeSingle();

      return `
        ${assinaturaCliente ? `
          <div class="card mb-4" style="border-color:var(--status-sucesso);">
            <div class="flex items-center gap-2"><span style="font-size:18px;">✓</span><span>Cliente assinou em ${formatarData(assinaturaCliente.assinatura_confirmada_em, true)}</span></div>
            <p class="text-muted mt-2" style="font-size:11px;">Assinatura eletrônica simples (evidência de aceite dentro do fluxo) — não é assinatura digital certificada ICP-Brasil.</p>
          </div>
        ` : ''}
        <div class="card mb-4">
          <div class="mono-label mb-2">Dados da assinatura</div>
          <div class="field"><label class="mono-label">Tipo de assinatura</label>
            <select id="asTipo" ${podeRegistrar ? '' : 'disabled'}>
              <option value="">—</option>
              <option value="eletronica" ${contrato.tipo_assinatura === 'eletronica' ? 'selected' : ''}>Eletrônica</option>
              <option value="fisica" ${contrato.tipo_assinatura === 'fisica' ? 'selected' : ''}>Física</option>
              <option value="outro" ${contrato.tipo_assinatura === 'outro' ? 'selected' : ''}>Outro</option>
            </select>
          </div>
          <div class="check-linha"><input type="checkbox" id="asCartorio" ${contrato.cartorio_reconhecido ? 'checked' : ''} ${podeRegistrar ? '' : 'disabled'} /><label for="asCartorio">Reconhecimento/autenticação em cartório</label></div>
          ${podeRegistrar ? `<button class="btn btn-secondary btn-sm" id="btnSalvarAssinatura">Salvar tipo de assinatura</button>` : ''}
        </div>

        <div class="card mb-4">
          <div class="mono-label mb-2">Upload do documento assinado</div>
          ${podeRegistrar ? `
            <input type="file" id="asArquivo" accept="application/pdf,image/*" />
            <button class="btn btn-primary btn-sm mt-2" id="btnUploadAssinado">Enviar documento assinado</button>
          ` : `<p class="text-muted">Disponível quando o contrato estiver aguardando assinatura.</p>`}
        </div>

        ${podeValidar ? `
          <div class="card">
            <div class="mono-label mb-2">Validação</div>
            <div class="field"><label class="mono-label">Observação da validação</label><textarea id="asObservacaoValidacao" rows="2"></textarea></div>
            <button class="btn btn-primary" id="btnValidarContrato">Validar contrato</button>
          </div>
        ` : ''}
      `;
    }

    function ligarEventosAssinatura() {
      const btnSalvarAssinatura = document.getElementById('btnSalvarAssinatura');
      if (btnSalvarAssinatura) {
        btnSalvarAssinatura.addEventListener('click', async () => {
          const tipo = document.getElementById('asTipo').value || null;
          const cartorio = document.getElementById('asCartorio').checked;
          const { error } = await supabase.from('contratos').update({ tipo_assinatura: tipo, cartorio_reconhecido: cartorio }).eq('id', contratoId);
          if (error) { alert('Não foi possível salvar: ' + error.message); return; }
          await carregarCabecalho();
        });
      }

      const btnUpload = document.getElementById('btnUploadAssinado');
      if (btnUpload) {
        btnUpload.addEventListener('click', async () => {
          const input = document.getElementById('asArquivo');
          const arquivo = input.files[0];
          if (!arquivo) { alert('Escolha um arquivo primeiro.'); return; }
          btnUpload.disabled = true; btnUpload.textContent = 'Enviando...';
          try {
            await salvarDocumentoContrato({
              empresaId, contratoId, blob: arquivo, categoria: 'assinado',
              nomeArquivo: arquivo.name, usuarioId,
              motivoSubstituicao: 'Upload manual do documento assinado pelo cliente',
            });
            if (contrato.status === 'aguardando_assinatura') {
              await supabase.from('contratos').update({ status: 'assinado' }).eq('id', contratoId);
            }
            await supabase.from('atividades').insert({ empresa_id: empresaId, contrato_id: contratoId, tipo: 'documento_recebido', titulo: 'Documento assinado recebido/anexado', usuario_id: usuarioId });
            alert('Documento assinado registrado com sucesso.');
            await carregarCabecalho();
            await abrirAba('assinatura');
          } catch (err) {
            alert('Falha no upload: ' + err.message);
          } finally {
            btnUpload.disabled = false; btnUpload.textContent = 'Enviar documento assinado';
          }
        });
      }

      const btnValidar = document.getElementById('btnValidarContrato');
      if (btnValidar) {
        btnValidar.addEventListener('click', async () => {
          if (!confirm('Validar este contrato? Depois de validado, alterações comerciais exigem permissão de administrador.')) return;
          const observacao = document.getElementById('asObservacaoValidacao').value.trim() || null;
          btnValidar.disabled = true; btnValidar.textContent = 'Validando...';
          const { error } = await supabase.from('contratos').update({
            status: 'validado', validado_por: usuarioId, validado_em: new Date().toISOString(), observacao_validacao: observacao,
          }).eq('id', contratoId);
          if (error) { alert('Não foi possível validar: ' + error.message); btnValidar.disabled = false; btnValidar.textContent = 'Validar contrato'; return; }
          await supabase.from('atividades').insert({ empresa_id: empresaId, contrato_id: contratoId, tipo: 'contrato_validado', titulo: 'Contrato validado', usuario_id: usuarioId, descricao: observacao });
          alert('Contrato validado com sucesso.');
          await carregarCabecalho();
          await abrirAba('assinatura');
        });
      }
    }

    // ==================== ABA TIMELINE ====================
    async function abaTimeline() {
      const { data, error } = await supabase.from('atividades').select('*').eq('contrato_id', contratoId).order('created_at', { ascending: false }).limit(100);
      if (error) return `<div class="error-state"><p>Não foi possível carregar a timeline.</p></div>`;
      if (!data || data.length === 0) return `<div class="empty-state"><p>Nenhum evento registrado ainda.</p></div>`;
      return `<div class="card"><div class="timeline">
        ${data.map((a) => `
          <div class="timeline-item">
            <div class="ts">${formatarData(a.created_at, true)}</div>
            <div class="title">${escapeHtml(a.titulo)}</div>
            ${a.descricao ? `<div class="desc">${escapeHtml(a.descricao)}</div>` : ''}
          </div>
        `).join('')}
      </div></div>`;
    }

    const abas = {
      comercial: async () => abaComercial(),
      documento: async () => abaDocumento(),
      link: async () => abaLink(),
      assinatura: async () => abaAssinatura(),
      timeline: async () => abaTimeline(),
    };
    const ligarEventos = { comercial: ligarEventosComercial, documento: ligarEventosDocumento, link: ligarEventosLink, assinatura: ligarEventosAssinatura, timeline: () => {} };

    async function abrirAba(nome) {
      document.querySelectorAll('#tabsNav .tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === nome));
      const content = document.getElementById('tabContent');
      content.innerHTML = '<div class="skeleton skeleton-row"></div>';
      content.innerHTML = await abas[nome]();
      ligarEventos[nome]();
    }

    document.querySelectorAll('#tabsNav .tab').forEach((btn) => btn.addEventListener('click', () => abrirAba(btn.dataset.tab)));

    await carregarCabecalho();
    if (contrato) {
      renderBlocoRecorrencia(document.getElementById('blocoRecorrencia'), { filtro: { contrato_id: contratoId }, podeCancelar: podeEditar });
      await abrirAba('comercial');
    }
  </script>
</body>
</html>
