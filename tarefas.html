<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarefas — CRM Criativamente</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <style>
    .tarefa-row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .tarefa-row:last-child { border-bottom: none; }
    .tarefa-check { width: 18px; height: 18px; border: 1px solid var(--line-strong); border-radius: 50%; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .tarefa-check.feita { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .tarefa-titulo { flex: 1; font-size: 13.5px; }
    .tarefa-titulo.feita { color: var(--gray-2); text-decoration: line-through; }
    .tarefa-meta { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .prazo-atrasado { color: var(--status-erro); }

    .view-toggle { display: flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
    .view-toggle button { background: transparent; border: none; color: var(--gray-2); padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .view-toggle button.active { background: var(--accent); color: var(--accent-ink); }

    .kanban-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px; }
    .kanban-col { flex: 0 0 280px; background: var(--near-black); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; max-height: calc(100vh - 220px); }
    .kanban-col-header { padding: 12px 14px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; }
    .kanban-col-body { padding: 10px; overflow-y: auto; flex: 1; min-height: 60px; }
    .kanban-col-body.drag-over { background: rgba(156,255,25,0.06); }
    .kanban-card { background: var(--black); border: 1px solid var(--line); border-left: 3px solid var(--line-strong); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; cursor: grab; font-size: 13px; position: relative; }
    .kanban-card:active { cursor: grabbing; }
    .kanban-card.prioridade-alta { border-left-color: var(--status-erro); }
    .kanban-card.prioridade-media { border-left-color: var(--accent); }
    .kanban-card.prioridade-baixa { border-left-color: var(--line-strong); }
    .kanban-card .titulo { font-weight: 600; margin-bottom: 6px; padding-right: 18px; }
    .kanban-card .obs-preview { color: var(--gray-2); font-size: 12px; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .kanban-card .linha-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .kanban-card .atualizada { color: var(--gray-2); font-size: 11px; margin-top: 6px; }
    .kanban-card .btn-excluir-card { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--gray-2); cursor: pointer; font-size: 12px; line-height: 1; padding: 2px; }
    .kanban-card .btn-excluir-card:hover { color: var(--status-erro); }
    .kanban-card .btn-concluir-card { position: absolute; top: 8px; right: 26px; background: none; border: none; color: var(--gray-2); cursor: pointer; font-size: 13px; line-height: 1; padding: 2px; }
    .kanban-card .btn-concluir-card:hover { color: var(--status-sucesso); }

    .resumo-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .resumo-chip { background: var(--near-black); border: 1px solid var(--line); border-left: 3px solid var(--line-strong); border-radius: var(--radius); padding: 9px 14px; cursor: pointer; min-width: 120px; text-align: left; }
    .resumo-chip:hover { border-color: var(--line-strong); }
    .resumo-chip.ativo { background: rgba(156,255,25,0.06); }
    .resumo-chip .n { font-size: 20px; font-weight: 800; }
    .resumo-chip .l { font-size: 11px; color: var(--gray-2); text-transform: uppercase; letter-spacing: .03em; margin-top: 2px; }
    .resumo-chip.erro { border-left-color: var(--status-erro); }
    .resumo-chip.alerta { border-left-color: var(--status-alerta); }
    .resumo-chip.info { border-left-color: var(--status-info); }
    .resumo-chip.sucesso { border-left-color: var(--status-sucesso); }
    .resumo-detalhe { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin: -4px 0 14px; font-size: 13px; }
    .resumo-detalhe .item { padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .resumo-detalhe .item:last-child { border-bottom: none; }
    .resumo-detalhe .item:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarContainer"></div>
    <div class="main-area">
      <div id="headerContainer"></div>
      <div class="page-content">

        <div class="filter-bar">
          <div class="view-toggle">
            <button class="active" id="btnViewKanban">Quadro</button>
            <button id="btnViewLista">Lista</button>
          </div>
          <div class="tabs" id="filtroDono" style="border-bottom:none; margin-bottom:0;">
            <button class="tab active" data-dono="minhas">Minhas</button>
            <button class="tab" data-dono="todas">Todas</button>
          </div>
          <div class="tabs" id="filtroStatus" style="border-bottom:none; margin-bottom:0;">
            <button class="tab active" data-status="abertas">Em aberto</button>
            <button class="tab" data-status="concluidas">Concluídas</button>
            <button class="tab" data-status="todas">Todas</button>
          </div>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="btnNovaTarefa">+ Nova Tarefa</button>
        </div>

        <div class="resumo-bar" id="resumoBar"></div>
        <div class="resumo-detalhe hidden" id="resumoDetalhe"></div>

        <div id="areaKanban"><div class="skeleton" style="height:400px;"></div></div>
        <div class="card hidden" id="listaTarefas" style="padding:0;"></div>

      </div>
    </div>
  </div>

  <!-- Modal Nova Tarefa -->
  <div id="modalOverlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100;">
    <div class="card" style="width:100%; max-width:440px;">
      <div class="flex items-center justify-between mb-4">
        <span class="mono-label" id="modalTituloTarefa">Nova Tarefa</span>
        <button class="btn-ghost" id="btnFecharModal">Fechar</button>
      </div>
      <p class="field-error hidden" id="modalErro"></p>
      <form id="formNovaTarefa">
        <input type="hidden" id="tarefaIdEmEdicao" />
        <div class="field">
          <label class="mono-label">Título *</label>
          <input type="text" id="fTitulo" required />
        </div>
        <div class="field">
          <label class="mono-label">Prioridade</label>
          <select id="fPrioridade">
            <option value="media">Média</option>
            <option value="baixa">Baixa</option>
            <option value="alta">Alta</option>
          </select>
        </div>
        <div class="field">
          <label class="mono-label">Prazo</label>
          <input type="date" id="fPrazo" />
        </div>
        <div class="field">
          <label class="mono-label">Vincular a</label>
          <select id="fVinculoTipo">
            <option value="">Nenhum (tarefa interna)</option>
            <option value="contato">Contato</option>
            <option value="oportunidade">Oportunidade</option>
            <option value="contrato">Contrato</option>
            <option value="projeto">Projeto</option>
          </select>
        </div>
        <div class="field hidden" id="campoVinculoBusca">
          <label class="mono-label">Buscar</label>
          <input type="text" id="fBuscaVinculo" autocomplete="off" />
          <div id="listaVinculo" style="border:1px solid var(--line); border-top:none; max-height:140px; overflow-y:auto;"></div>
          <input type="hidden" id="fVinculoId" />
          <div id="vinculoSelecionado" class="mt-2 text-muted" style="font-size:12.5px;"></div>
        </div>
        <div id="tarefaCarimboTempo" class="mb-3 text-muted" style="font-size:12px;"></div>
        <div class="flex gap-2">
          <button type="submit" class="btn btn-primary btn-block" id="btnSalvarTarefa">Criar Tarefa</button>
          <button type="button" class="btn btn-secondary hidden" id="btnConcluirTarefa" style="white-space:nowrap;">Concluir ✓</button>
        </div>
      </form>

      <div id="blocoNotas" class="hidden" style="margin-top:20px; border-top:1px solid var(--line); padding-top:16px;">
        <span class="mono-label">Notas</span>
        <div id="listaNotas" class="mt-2" style="max-height:220px; overflow-y:auto;"></div>
        <div class="field mt-3">
          <textarea id="fNovaNota" rows="2" placeholder="Escreva uma nota e registre — fica salva com data e hora, sem apagar as anteriores."></textarea>
        </div>
        <button type="button" class="btn btn-secondary btn-block" id="btnAdicionarNota">Registrar nota</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/src/lib/supabaseClient.js';
    import { handleQueryError } from '/src/lib/session.js';
    import { initPage } from '/src/lib/pageInit.js';
    import { formatarData, tempoRelativo, escapeHtml } from '/src/lib/format.js';

    const { perm, session } = await initPage({ paginaAtual: 'tarefas.html', breadcrumb: 'CRM / Tarefas', title: 'Tarefas' });
    const empresaId = perm ? perm.empresa_id : null;
    const meuId = session.user.id;

    let filtroDono = 'minhas';
    let filtroStatus = 'abertas';
    let visao = 'kanban';
    let tarefasCache = [];

    const VINCULO_LABEL = { contato: 'Contato', oportunidade: 'Oportunidade', contrato: 'Contrato', projeto: 'Projeto', lead: 'Contato', cliente: 'Contato', interna: 'Interna', projeto_etapa: 'Etapa de projeto' };
    const COLUNAS_KANBAN = [
      { status: 'pendente', titulo: 'Pendente' },
      { status: 'em_andamento', titulo: 'Em andamento' },
      { status: 'concluida', titulo: 'Concluída' },
    ];

    function ehAtrasada(t) {
      const hoje = new Date().toISOString().slice(0, 10);
      return t.status !== 'concluida' && t.prazo && t.prazo.slice(0, 10) < hoje;
    }

    function metaBadges(t) {
      const atrasada = ehAtrasada(t);
      return `
        ${t.vinculo_tipo ? `<span class="badge dot-info"><span class="dot"></span>${VINCULO_LABEL[t.vinculo_tipo] || t.vinculo_tipo}</span>` : ''}
        ${t.prazo ? `<span class="cell-muted ${atrasada ? 'prazo-atrasado' : ''}" style="font-family:var(--font-mono); font-size:12px;">${formatarData(t.prazo)}</span>` : ''}
      `;
    }

    async function carregarDados() {
      let query = supabase.from('tarefas').select('*').neq('status', 'cancelada').order('prazo', { ascending: true, nullsFirst: false });
      if (filtroDono === 'minhas') query = query.eq('responsavel_id', meuId);

      const { data, error } = await query;
      if (error) {
        if (await handleQueryError(error)) return;
        document.getElementById('areaKanban').innerHTML = `<div class="error-state"><p>Não foi possível carregar as tarefas agora.</p></div>`;
        document.getElementById('listaTarefas').innerHTML = `<div class="error-state"><p>Não foi possível carregar as tarefas agora.</p></div>`;
        return;
      }

      tarefasCache = data || [];
      renderKanban();
      renderLista();
      renderResumo();
    }

    // ---------------- RESUMO DE PRAZOS ----------------
    let resumoAberto = null;

    function diasAte(prazoIso) {
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      const prazo = new Date(prazoIso + 'T00:00:00');
      return Math.round((prazo - hoje) / 86400000);
    }

    function calcularBaldes() {
      const abertas = tarefasCache.filter((t) => t.status !== 'concluida');
      const baldes = { atrasadas: [], ate3: [], ate7: [], emDia: [] };
      abertas.forEach((t) => {
        if (!t.prazo) { baldes.emDia.push(t); return; }
        const dias = diasAte(t.prazo.slice(0, 10));
        if (dias < 0) baldes.atrasadas.push(t);
        else if (dias <= 3) baldes.ate3.push(t);
        else if (dias <= 7) baldes.ate7.push(t);
        else baldes.emDia.push(t);
      });
      return baldes;
    }

    function renderResumo() {
      const baldes = calcularBaldes();
      const chips = [
        { chave: 'atrasadas', classe: 'erro', label: 'Atrasadas', itens: baldes.atrasadas },
        { chave: 'ate3', classe: 'alerta', label: 'Vencem em até 3 dias', itens: baldes.ate3 },
        { chave: 'ate7', classe: 'info', label: 'Vencem em até 7 dias', itens: baldes.ate7 },
        { chave: 'emDia', classe: 'sucesso', label: 'Em dia / sem prazo', itens: baldes.emDia },
      ];

      document.getElementById('resumoBar').innerHTML = chips.map((c) => `
        <button class="resumo-chip ${c.classe} ${resumoAberto === c.chave ? 'ativo' : ''}" data-chave="${c.chave}">
          <div class="n">${c.itens.length}</div>
          <div class="l">${c.label}</div>
        </button>
      `).join('');

      document.querySelectorAll('.resumo-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          resumoAberto = resumoAberto === chip.dataset.chave ? null : chip.dataset.chave;
          renderResumo();
        });
      });

      const detalhe = document.getElementById('resumoDetalhe');
      if (!resumoAberto) { detalhe.classList.add('hidden'); detalhe.innerHTML = ''; return; }
      const balde = chips.find((c) => c.chave === resumoAberto);
      detalhe.classList.remove('hidden');
      detalhe.innerHTML = balde.itens.length === 0
        ? `<div class="text-muted" style="font-size:12.5px;">Nenhuma tarefa aqui.</div>`
        : balde.itens.map((t) => `
            <div class="item" data-id="${t.id}">
              ${escapeHtml(t.titulo)}
              ${t.prazo ? `<span class="cell-muted" style="font-family:var(--font-mono); font-size:11.5px; float:right;">${formatarData(t.prazo)}</span>` : ''}
            </div>
          `).join('');
      detalhe.querySelectorAll('.item').forEach((item) => {
        item.addEventListener('click', () => abrirModalEdicaoTarefa(item.dataset.id));
      });
    }

    // ---------------- QUADRO (Kanban) ----------------
    function cardHtml(t) {
      const atrasada = ehAtrasada(t);
      const feita = t.status === 'concluida';
      return `
        <div class="kanban-card prioridade-${t.prioridade || 'media'}" draggable="true" data-id="${t.id}">
          <button class="btn-excluir-card" data-id="${t.id}" title="Excluir">✕</button>
          ${!feita ? `<button class="btn-concluir-card" data-id="${t.id}" title="Concluir">✓</button>` : ''}
          <div class="titulo">${escapeHtml(t.titulo)}</div>
          ${t.observacoes ? `<div class="obs-preview">${escapeHtml(t.observacoes)}</div>` : ''}
          <div class="linha-meta">${metaBadges(t)}</div>
          <div class="atualizada" title="Atualizada em ${formatarData(t.updated_at, true)}">atualizada ${tempoRelativo(t.updated_at)}</div>
        </div>
      `;
    }

    function renderKanban() {
      const el = document.getElementById('areaKanban');
      if (tarefasCache.length === 0) {
        el.innerHTML = `<div class="empty-state"><div class="icon">✓</div><p>Nenhuma tarefa por aqui.</p></div>`;
        return;
      }
      el.innerHTML = `
        <div class="kanban-scroll">
          ${COLUNAS_KANBAN.map((col) => {
            const desta = tarefasCache.filter((t) => t.status === col.status);
            return `
              <div class="kanban-col">
                <div class="kanban-col-header">
                  <span>${col.titulo} (${desta.length})</span>
                </div>
                <div class="kanban-col-body" data-status="${col.status}">
                  ${desta.map(cardHtml).join('') || '<div class="text-muted" style="font-size:12px; padding:8px;">Vazio</div>'}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
      ativarCardsKanban();
    }

    function ativarCardsKanban() {
      document.querySelectorAll('.kanban-card').forEach((card) => {
        card.addEventListener('click', () => abrirModalEdicaoTarefa(card.dataset.id));
        card.addEventListener('dragstart', () => { idArrastando = card.dataset.id; });
      });
      document.querySelectorAll('.btn-excluir-card').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('Excluir esta tarefa?')) return;
          const { error } = await supabase.from('tarefas').delete().eq('id', btn.dataset.id);
          if (!error) carregarDados();
        });
      });
      document.querySelectorAll('.btn-concluir-card').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const { error } = await supabase.from('tarefas').update({ status: 'concluida' }).eq('id', btn.dataset.id);
          if (!error) carregarDados();
        });
      });
      document.querySelectorAll('.kanban-col-body').forEach((col) => {
        col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drag-over'); });
        col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
        col.addEventListener('drop', async (e) => {
          e.preventDefault();
          col.classList.remove('drag-over');
          if (!idArrastando) return;
          const novoStatus = col.dataset.status;
          const { error } = await supabase.from('tarefas').update({ status: novoStatus }).eq('id', idArrastando);
          idArrastando = null;
          if (!error) carregarDados();
        });
      });
    }
    let idArrastando = null;

    // ---------------- LISTA ----------------
    function renderLista() {
      const el = document.getElementById('listaTarefas');
      let data = tarefasCache;
      if (filtroStatus === 'abertas') data = data.filter((t) => t.status === 'pendente' || t.status === 'em_andamento');
      if (filtroStatus === 'concluidas') data = data.filter((t) => t.status === 'concluida');

      if (data.length === 0) {
        el.innerHTML = `<div class="empty-state"><div class="icon">✓</div><p>Nenhuma tarefa por aqui.</p></div>`;
        return;
      }

      el.innerHTML = data.map((t) => {
        const feita = t.status === 'concluida';
        return `
          <div class="tarefa-row">
            <div class="tarefa-check ${feita ? 'feita' : ''}" data-id="${t.id}" data-feita="${feita}">${feita ? '✓' : ''}</div>
            <div class="tarefa-titulo ${feita ? 'feita' : ''}" data-id="${t.id}" style="cursor:pointer;">${escapeHtml(t.titulo)}</div>
            <div class="tarefa-meta">
              ${metaBadges(t)}
              <span class="cell-muted" style="font-size:11.5px;" title="Atualizada em ${formatarData(t.updated_at, true)}">atualizada ${tempoRelativo(t.updated_at)}</span>
              <button class="btn-icone btn-editar-tarefa" data-id="${t.id}" title="Editar">✎</button>
              <button class="btn-icone btn-excluir-tarefa" data-id="${t.id}" title="Excluir">✕</button>
            </div>
          </div>
        `;
      }).join('');

      el.querySelectorAll('.tarefa-check').forEach((chk) => {
        chk.addEventListener('click', async () => {
          const feita = chk.dataset.feita === 'true';
          const { error } = await supabase.from('tarefas').update({ status: feita ? 'pendente' : 'concluida' }).eq('id', chk.dataset.id);
          if (!error) carregarDados();
        });
      });
      el.querySelectorAll('.tarefa-titulo, .btn-editar-tarefa').forEach((elem) => {
        elem.addEventListener('click', () => abrirModalEdicaoTarefa(elem.dataset.id));
      });
      el.querySelectorAll('.btn-excluir-tarefa').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('Excluir esta tarefa?')) return;
          const { error } = await supabase.from('tarefas').delete().eq('id', btn.dataset.id);
          if (!error) carregarDados();
        });
      });
    }

    // ---------------- NOTAS (registro tipo Salesforce/Trello, não apaga as anteriores) ----------------
    let usuariosMap = null;
    async function nomesUsuarios() {
      if (usuariosMap) return usuariosMap;
      const { data } = await supabase.from('usuarios').select('id, nome');
      usuariosMap = {};
      (data || []).forEach((u) => { usuariosMap[u.id] = u.nome; });
      return usuariosMap;
    }

    async function carregarNotas(tarefaId, observacaoAntiga) {
      const lista = document.getElementById('listaNotas');
      lista.innerHTML = `<div class="text-muted" style="font-size:12px;">Carregando...</div>`;
      const nomes = await nomesUsuarios();
      const { data } = await supabase.from('atividades').select('*').eq('tarefa_id', tarefaId).eq('tipo', 'nota').order('created_at', { ascending: false });

      const notas = data || [];
      const legado = observacaoAntiga
        ? `<div class="timeline-item"><div class="ts">Observação original</div><div class="desc">${escapeHtml(observacaoAntiga)}</div></div>`
        : '';

      if (notas.length === 0 && !legado) {
        lista.innerHTML = `<div class="text-muted" style="font-size:12px;">Nenhuma nota registrada ainda.</div>`;
        return;
      }

      lista.innerHTML = `
        <div class="timeline">
          ${notas.map((n) => `
            <div class="timeline-item">
              <div class="ts">${formatarData(n.created_at, true)}${n.usuario_id && nomes[n.usuario_id] ? ` · ${escapeHtml(nomes[n.usuario_id])}` : ''}</div>
              <div class="desc">${escapeHtml(n.descricao || '')}</div>
            </div>
          `).join('')}
          ${legado}
        </div>
      `;
    }

    document.getElementById('btnAdicionarNota').addEventListener('click', async () => {
      const tarefaId = document.getElementById('tarefaIdEmEdicao').value;
      const texto = document.getElementById('fNovaNota').value.trim();
      if (!tarefaId || !texto) return;
      const btn = document.getElementById('btnAdicionarNota');
      btn.disabled = true; btn.textContent = 'Registrando...';

      const { error } = await supabase.from('atividades').insert({
        empresa_id: empresaId, tarefa_id: tarefaId, tipo: 'nota', titulo: 'Nota', descricao: texto, usuario_id: meuId,
      });

      btn.disabled = false; btn.textContent = 'Registrar nota';
      if (error) { alert('Não foi possível registrar a nota agora.'); return; }

      document.getElementById('fNovaNota').value = '';
      const t = tarefasCache.find((x) => x.id === tarefaId);
      await carregarNotas(tarefaId, t ? t.observacoes : null);
    });

    // ---------------- MODAL EDIÇÃO (compartilhado pelas duas visões) ----------------
    async function abrirModalEdicaoTarefa(tarefaId) {
      const t = tarefasCache.find((x) => x.id === tarefaId);
      if (!t) return;
      document.getElementById('tarefaIdEmEdicao').value = t.id;
      document.getElementById('modalTituloTarefa').textContent = 'Editar Tarefa';
      document.getElementById('btnSalvarTarefa').textContent = 'Salvar alterações';
      document.getElementById('fTitulo').value = t.titulo;
      document.getElementById('fPrioridade').value = t.prioridade || 'media';
      document.getElementById('fPrazo').value = t.prazo ? t.prazo.slice(0, 10) : '';
      document.getElementById('tarefaCarimboTempo').textContent =
        `Criada em ${formatarData(t.created_at, true)} · Atualizada em ${formatarData(t.updated_at, true)}`;

      document.getElementById('blocoNotas').classList.remove('hidden');
      await carregarNotas(t.id, t.observacoes);

      const btnConcluir = document.getElementById('btnConcluirTarefa');
      btnConcluir.classList.remove('hidden');
      btnConcluir.textContent = t.status === 'concluida' ? 'Reabrir' : 'Concluir ✓';
      btnConcluir.dataset.statusAlvo = t.status === 'concluida' ? 'pendente' : 'concluida';

      document.getElementById('fVinculoTipo').value = t.vinculo_tipo || '';
      const campoVinculo = document.getElementById('campoVinculoBusca');
      campoVinculo.classList.toggle('hidden', !t.vinculo_tipo);
      document.getElementById('fVinculoId').value = t.vinculo_id || '';
      document.getElementById('fBuscaVinculo').value = '';
      document.getElementById('vinculoSelecionado').textContent = '';

      // O vínculo já salvo não traz o nome junto (só o id) -- busca o nome pra
      // não aparecer em branco como se o vínculo tivesse sumido.
      const conf = TABELA_POR_TIPO[t.vinculo_tipo];
      if (conf && t.vinculo_id) {
        const { data } = await supabase.from(conf.tabela).select(`id, ${conf.campo}`).eq('id', t.vinculo_id).maybeSingle();
        if (data) {
          document.getElementById('fBuscaVinculo').value = data[conf.campo];
          document.getElementById('vinculoSelecionado').textContent = `Selecionado: ${data[conf.campo]}`;
        } else {
          document.getElementById('vinculoSelecionado').textContent = 'Vínculo original não encontrado (pode ter sido excluído) — busque de novo se quiser trocar.';
        }
      }

      overlay.classList.remove('hidden');
    }

    // ---------------- TOGGLE VIEW ----------------
    document.getElementById('btnViewKanban').addEventListener('click', () => {
      visao = 'kanban';
      document.getElementById('btnViewKanban').classList.add('active');
      document.getElementById('btnViewLista').classList.remove('active');
      document.getElementById('areaKanban').classList.remove('hidden');
      document.getElementById('listaTarefas').classList.add('hidden');
      document.getElementById('filtroStatus').classList.add('hidden');
    });
    document.getElementById('btnViewLista').addEventListener('click', () => {
      visao = 'lista';
      document.getElementById('btnViewLista').classList.add('active');
      document.getElementById('btnViewKanban').classList.remove('active');
      document.getElementById('listaTarefas').classList.remove('hidden');
      document.getElementById('areaKanban').classList.add('hidden');
      document.getElementById('filtroStatus').classList.remove('hidden');
    });
    document.getElementById('filtroStatus').classList.add('hidden');

    document.querySelectorAll('#filtroDono .tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filtroDono .tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        filtroDono = btn.dataset.dono;
        carregarDados();
      });
    });
    document.querySelectorAll('#filtroStatus .tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filtroStatus .tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        filtroStatus = btn.dataset.status;
        renderLista();
      });
    });

    // ---------------- MODAL NOVA TAREFA ----------------
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('btnNovaTarefa').addEventListener('click', () => {
      document.getElementById('formNovaTarefa').reset();
      document.getElementById('tarefaIdEmEdicao').value = '';
      document.getElementById('modalTituloTarefa').textContent = 'Nova Tarefa';
      document.getElementById('btnSalvarTarefa').textContent = 'Criar Tarefa';
      document.getElementById('campoVinculoBusca').classList.add('hidden');
      document.getElementById('fVinculoId').value = '';
      document.getElementById('vinculoSelecionado').textContent = '';
      document.getElementById('tarefaCarimboTempo').textContent = '';
      document.getElementById('blocoNotas').classList.add('hidden');
      document.getElementById('btnConcluirTarefa').classList.add('hidden');
      overlay.classList.remove('hidden');
    });
    document.getElementById('btnFecharModal').addEventListener('click', () => overlay.classList.add('hidden'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.add('hidden'); });

    document.getElementById('btnConcluirTarefa').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const tarefaId = document.getElementById('tarefaIdEmEdicao').value;
      if (!tarefaId) return;
      btn.disabled = true;
      const { error } = await supabase.from('tarefas').update({ status: btn.dataset.statusAlvo }).eq('id', tarefaId);
      btn.disabled = false;
      if (error) { alert('Não foi possível atualizar o status agora.'); return; }
      overlay.classList.add('hidden');
      await carregarDados();
    });

    document.getElementById('fVinculoTipo').addEventListener('change', (e) => {
      const campo = document.getElementById('campoVinculoBusca');
      if (e.target.value) {
        campo.classList.remove('hidden');
      } else {
        campo.classList.add('hidden');
        document.getElementById('fVinculoId').value = '';
        document.getElementById('vinculoSelecionado').textContent = '';
      }
    });

    // (o clique-para-abrir-calendário agora é automático em toda a
    // aplicação, ativado pelo initPage() — não precisa de código aqui)

    const TABELA_POR_TIPO = { contato: { tabela: 'contatos', campo: 'nome' }, oportunidade: { tabela: 'oportunidades', campo: 'titulo' }, contrato: { tabela: 'contratos', campo: 'titulo' }, projeto: { tabela: 'projetos', campo: 'nome' } };

    document.getElementById('fBuscaVinculo').addEventListener('input', async (e) => {
      const tipo = document.getElementById('fVinculoTipo').value;
      const conf = TABELA_POR_TIPO[tipo];
      const termo = e.target.value.trim();
      const lista = document.getElementById('listaVinculo');
      if (!conf || termo.length < 2) { lista.innerHTML = ''; return; }

      const { data } = await supabase.from(conf.tabela).select(`id, ${conf.campo}`).ilike(conf.campo, `%${termo}%`).limit(8);
      lista.innerHTML = (data || []).map((item) => `
        <div class="vinculo-opcao" data-id="${item.id}" data-nome="${escapeHtml(item[conf.campo])}" style="padding:8px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--line);">
          ${escapeHtml(item[conf.campo])}
        </div>
      `).join('');
      lista.querySelectorAll('.vinculo-opcao').forEach((op) => {
        op.addEventListener('click', () => {
          document.getElementById('fVinculoId').value = op.dataset.id;
          document.getElementById('vinculoSelecionado').textContent = `Selecionado: ${op.dataset.nome}`;
          document.getElementById('fBuscaVinculo').value = op.dataset.nome;
          lista.innerHTML = '';
        });
      });
    });

    document.getElementById('formNovaTarefa').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroBox = document.getElementById('modalErro');
      erroBox.classList.add('hidden');
      const btn = document.getElementById('btnSalvarTarefa');
      const idEmEdicao = document.getElementById('tarefaIdEmEdicao').value;
      btn.disabled = true; btn.textContent = idEmEdicao ? 'Salvando...' : 'Criando...';

      const vinculoTipo = document.getElementById('fVinculoTipo').value || null;
      const vinculoId = document.getElementById('fVinculoId').value || null;

      const payloadBase = {
        titulo: document.getElementById('fTitulo').value.trim(),
        prioridade: document.getElementById('fPrioridade').value,
        prazo: document.getElementById('fPrazo').value || null,
        vinculo_tipo: vinculoTipo,
        vinculo_id: vinculoTipo ? vinculoId : null,
      };

      const { error } = idEmEdicao
        ? await supabase.from('tarefas').update(payloadBase).eq('id', idEmEdicao)
        : await supabase.from('tarefas').insert({ ...payloadBase, empresa_id: empresaId, responsavel_id: meuId, status: 'pendente' });

      btn.disabled = false; btn.textContent = idEmEdicao ? 'Salvar alterações' : 'Criar Tarefa';

      if (error) {
        erroBox.textContent = idEmEdicao ? 'Não foi possível salvar as alterações agora.' : 'Não foi possível criar a tarefa agora.';
        erroBox.classList.remove('hidden');
        return;
      }

      overlay.classList.add('hidden');
      document.getElementById('formNovaTarefa').reset();
      document.getElementById('campoVinculoBusca').classList.add('hidden');
      await carregarDados();
    });

    await carregarDados();
  </script>
</body>
</html>
